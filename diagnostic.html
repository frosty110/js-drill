<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4-Day Interview Diagnostic</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --text:#e2e8f0;
    --muted:#94a3b8; --accent:#38bdf8; --good:#22c55e; --bad:#ef4444;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--panel2);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:600}
  header .meta{font-size:13px;color:var(--muted)}
  #progress-wrap{flex:1;min-width:200px;height:6px;background:var(--panel);
    border-radius:3px;overflow:hidden}
  #progress-bar{height:100%;background:var(--accent);width:0;transition:width .2s}
  main{flex:1;display:flex;justify-content:center;padding:24px 16px}
  .card{max-width:760px;width:100%;background:var(--panel);border-radius:12px;
    padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.2)}
  .tag{display:inline-block;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;padding:3px 8px;border-radius:4px;
    background:var(--panel2);color:var(--muted);margin-right:6px}
  .tag.diff-easy{background:#14532d;color:#bbf7d0}
  .tag.diff-medium{background:#713f12;color:#fde68a}
  .tag.diff-hard{background:#7f1d1d;color:#fecaca}
  .prompt{font-size:17px;line-height:1.55;margin:14px 0 20px;white-space:pre-wrap}
  .prompt code,.options code,.short code{background:#0b1220;padding:1px 5px;
    border-radius:3px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#fde68a}
  pre{background:#0b1220;padding:12px 14px;border-radius:6px;overflow-x:auto;
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#e2e8f0;
    margin:10px 0}
  .options{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
    background:var(--panel2);border-radius:8px;cursor:pointer;
    border:2px solid transparent;transition:all .15s}
  .opt:hover{background:#475569}
  .opt.selected{border-color:var(--accent);background:#1e3a5c}
  .opt-letter{font-weight:600;color:var(--accent);min-width:18px}
  .opt-body{flex:1}
  textarea{width:100%;min-height:120px;background:var(--panel2);color:var(--text);
    border:1px solid #475569;border-radius:8px;padding:12px;font:14px/1.5 inherit;
    resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .footer-bar{padding:14px 20px;border-top:1px solid var(--panel2);
    display:flex;gap:10px;align-items:center;justify-content:space-between;
    flex-wrap:wrap}
  .btn{background:var(--panel2);color:var(--text);border:none;padding:9px 16px;
    border-radius:6px;font-size:14px;cursor:pointer;transition:background .15s}
  .btn:hover{background:#475569}
  .btn.primary{background:var(--accent);color:#0f172a;font-weight:600}
  .btn.primary:hover{background:#7dd3fc}
  .btn.good{background:var(--good);color:#0f172a;font-weight:600}
  .btn.good:hover{background:#4ade80}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .nav-right{display:flex;gap:8px}
  .intro h2{margin-top:0}
  .intro ul{padding-left:20px}
  .intro li{margin:6px 0}
  .pre-q{margin:18px 0}
  .pre-q label{display:block;font-weight:500;margin-bottom:6px}
  .pre-q input,.pre-q select{width:100%;background:var(--panel2);color:var(--text);
    border:1px solid #475569;border-radius:6px;padding:10px;font:14px inherit}
  .summary-table{width:100%;border-collapse:collapse;margin:14px 0}
  .summary-table th,.summary-table td{text-align:left;padding:8px 10px;
    border-bottom:1px solid var(--panel2)}
  .summary-table th{font-weight:600;color:var(--muted);font-size:12px;
    text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;
    font-size:12px;background:var(--panel2)}
  .pill.good{background:#14532d;color:#bbf7d0}
  .pill.warn{background:#713f12;color:#fde68a}
  .pill.bad{background:#7f1d1d;color:#fecaca}
  .question-jumper{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0}
  .jump-btn{width:28px;height:28px;border-radius:4px;background:var(--panel2);
    color:var(--muted);border:1px solid transparent;cursor:pointer;font-size:11px;
    padding:0;display:flex;align-items:center;justify-content:center}
  .jump-btn.answered{background:#1e3a5c;color:var(--accent)}
  .jump-btn.current{border-color:var(--accent)}
  .jump-btn.skipped{background:#713f12;color:#fde68a}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .note{font-size:13px;color:var(--warn);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>4-Day Interview Diagnostic</h1>
  <div class="meta" id="step-meta">Loading…</div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
</header>
<main><div class="card" id="content"></div></main>
<div class="footer-bar">
  <button class="btn" id="prev-btn">← Prev</button>
  <div class="meta" id="time-meta"></div>
  <div class="nav-right">
    <button class="btn" id="skip-btn">Skip</button>
    <button class="btn primary" id="next-btn">Next →</button>
  </div>
</div>

<script>
// ============================================================================
// QUESTION BANK
// ============================================================================
// MC questions: `answer` is the index of the correct option.
// Short questions: `rubric` is what I (Claude) look for when grading the export.
//   The rubric is NOT shown to the user during the diagnostic — it's only in
//   the exported JSON for grading purposes.
// ============================================================================

const QUESTIONS = [
  // -------------------- PART 1: PATTERN RECOGNITION (12) --------------------
  { id: 'p01', section: 'Pattern Recognition', difficulty: 'easy', type: 'mc',
    prompt: "Given an unsorted array of integers and a target, return the **indices** of two numbers that add to target.\n\nWhich approach fits best?",
    options: [
      "Sort the array, then binary search for `target - x` for each element",
      "Build a hash map of `value → index`, then for each `x` look up `target - x`",
      "Two-pointer from both ends after sorting",
      "Brute force nested loop"
    ],
    answer: 1 },

  { id: 'p02', section: 'Pattern Recognition', difficulty: 'easy', type: 'mc',
    prompt: "Given a string, return the length of the longest substring with **no repeated characters**.",
    options: [
      "Sliding window with a hash set (or last-seen map) of characters",
      "DP with a 2D table indexed by (start, end)",
      "Sort the chars, then linear scan for runs",
      "Backtracking with pruning"
    ],
    answer: 0 },

  { id: 'p03', section: 'Pattern Recognition', difficulty: 'easy', type: 'mc',
    prompt: "Given an array of daily stock prices, find the **max profit** from one buy + one sell (buy before sell).",
    options: [
      "Sliding window of fixed size 2",
      "Single pass: track running minimum so far, compute `price - min` each step, keep max",
      "DP with 2D state (held / not held)",
      "Sort the prices, take last − first"
    ],
    answer: 1 },

  { id: 'p04', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "Given a list of meetings as `[start, end]` intervals, find the **minimum number of rooms** needed so no meeting overlaps another in the same room.",
    options: [
      "Sort by start time, then DP over interval count",
      "Sort by start time + min-heap of end times (or sweep-line of +1/−1 events)",
      "Brute-force pairwise overlap check, O(n²)",
      "Topological sort"
    ],
    answer: 1 },

  { id: 'p05', section: 'Pattern Recognition', difficulty: 'easy', type: 'mc',
    prompt: "Given a binary tree, return its **level-order** traversal (each level as one array).",
    options: [
      "DFS pre-order",
      "DFS in-order",
      "BFS with a queue, tracking level size",
      "Two heaps"
    ],
    answer: 2 },

  { id: 'p06', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "Given a directed graph of course prerequisites, return a **valid course order** (or detect a cycle).",
    options: [
      "Union-Find",
      "Topological sort (Kahn's BFS using in-degrees, or DFS post-order)",
      "Dijkstra's algorithm",
      "DP with memoization"
    ],
    answer: 1 },

  { id: 'p07', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "Given a **stream** of integers (you cannot re-read), maintain and return the **K-th largest** at any moment.",
    options: [
      "Re-sort the buffered values each call, O(N log N) per query",
      "Min-heap of size K (push every value; pop when size > K; root is K-th largest)",
      "Max-heap of all values",
      "Self-balancing BST and query rank K"
    ],
    answer: 1 },

  { id: 'p08', section: 'Pattern Recognition', difficulty: 'easy', type: 'mc',
    prompt: "Given a string of `(`, `)`, `[`, `]`, `{`, `}`, return true if every closer matches the most recent unmatched opener.",
    options: [
      "One counter per bracket type",
      "Regular expression",
      "Stack — push openers, on closer check it matches the top",
      "Recursive descent"
    ],
    answer: 2 },

  { id: 'p09', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "Detect whether a singly linked list contains a cycle, using **O(1) extra space**.",
    options: [
      "Hash set of visited node references (O(n) extra space)",
      "Floyd's algorithm: fast pointer (2 steps) and slow pointer (1 step) — they collide iff there's a cycle",
      "Reverse the list and check if the tail equals the original head",
      "Recursion with depth counter"
    ],
    answer: 1 },

  { id: 'p10', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "Given a 2D grid of `'1'` (land) and `'0'` (water), count the number of **distinct islands** (connected components of land).",
    options: [
      "DFS or BFS flood-fill from each unvisited land cell, marking visited (or Union-Find)",
      "Sort all the land cells then scan",
      "DP across rows",
      "Trie of coordinates"
    ],
    answer: 0 },

  { id: 'p11', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "Real-world: you have a stream of incoming HTTP request timestamps. Implement: \"return true if the rate has exceeded N requests in the last `windowMs` ms.\"",
    options: [
      "Sort all timestamps each call, then count the tail",
      "Sliding window over a deque/queue of timestamps: evict timestamps older than `now - windowMs` from the front, then check size",
      "DP table over time buckets",
      "BFS over the request graph"
    ],
    answer: 1 },

  { id: 'p12', section: 'Pattern Recognition', difficulty: 'medium', type: 'mc',
    prompt: "You need to support `insert(word)` and `startsWith(prefix)` lookups in **O(prefix length)** time, on a dictionary of millions of words.",
    options: [
      "Hash set of words",
      "Sorted array of words + binary search",
      "Trie (prefix tree)",
      "Binary search tree of words"
    ],
    answer: 2 },

  // -------------------- PART 2: COMPLEXITY (6) --------------------
  { id: 'c01', section: 'Complexity', difficulty: 'easy', type: 'mc',
    prompt: "You build a hash map from N items, then perform M lookups against it. What's the total time (amortized, assuming a decent hash)?",
    options: ["O(N + M)", "O(N × M)", "O(N log N + M log N)", "O((N + M) log N)"],
    answer: 0 },

  { id: 'c02', section: 'Complexity', difficulty: 'medium', type: 'mc',
    prompt: "Recursive DFS on a **balanced** binary tree of N nodes. What's the auxiliary space (the call stack)?",
    options: [
      "O(1)",
      "O(log N) — the call-stack depth equals the tree depth",
      "O(N) always",
      "O(N log N)"
    ],
    answer: 1,
    rationale: "Worst case (skewed tree) is O(N), but balanced is O(log N)." },

  { id: 'c03', section: 'Complexity', difficulty: 'medium', type: 'mc',
    prompt: "What's the time complexity of `arr.indexOf(x)` called **inside a `for` loop** over the same array? (i.e., `for (const x of arr) if (other.indexOf(x) !== -1) ...`)",
    options: [
      "O(n)",
      "O(n²)",
      "O(n log n)",
      "O(1) amortized"
    ],
    answer: 1,
    rationale: "Classic perf trap. Convert `other` to a Set for O(n) total." },

  { id: 'c04', section: 'Complexity', difficulty: 'hard', type: 'mc',
    prompt: "Building a heap from an array of N items (`heapify` / sift-down from bottom). Best-known time?",
    options: ["O(N log N)", "O(N)", "O(log N)", "O(N²)"],
    answer: 1,
    rationale: "Floyd's heapify is O(N); successive inserts is O(N log N)." },

  { id: 'c05', section: 'Complexity', difficulty: 'easy', type: 'mc',
    prompt: "Given a sorted array (pre-sorted), and M independent lookups using binary search. Total time for the lookups?",
    options: [
      "O(N log N + M log N)",
      "O(log N + M)",
      "O(M log N)",
      "O(N × M)"
    ],
    answer: 2 },

  { id: 'c06', section: 'Complexity', difficulty: 'medium', type: 'mc',
    prompt: "Memoized recursion solving N distinct subproblems, each doing O(1) non-recursive work and recursing into O(1) children. Total time?",
    options: ["O(N)", "O(N log N)", "O(N²)", "O(2^N)"],
    answer: 0,
    rationale: "Each subproblem solved once, O(1) work each → O(N)." },

  // -------------------- PART 3: TRADE-OFFS (6) --------------------
  { id: 't01', section: 'Trade-offs', difficulty: 'medium', type: 'mc',
    prompt: "You need a frequency counter (`item → count`) in JS. Prefer `Map` or plain `Object`?",
    options: [
      "Object — property access is faster",
      "Map — O(1) `.size`, predictable insertion-order iteration, allows non-string keys, no prototype-pollution surprises",
      "Array of pairs — simpler",
      "Set — handles uniqueness for free"
    ],
    answer: 1 },

  { id: 't02', section: 'Trade-offs', difficulty: 'medium', type: 'mc',
    prompt: "Sort + two-pointer is **better** than the hash-map approach for which problem class?",
    options: [
      "Pair-sum / triplet-sum on values (e.g. 3Sum) where original indices don't matter and duplicate handling matters",
      "Two Sum where you must return the original indices",
      "Streaming integers you can't buffer",
      "Top-K queries"
    ],
    answer: 0,
    rationale: "3Sum/4Sum are clean with sort+two-pointer; the hash version is messier with duplicates." },

  { id: 't03', section: 'Trade-offs', difficulty: 'easy', type: 'mc',
    prompt: "Shortest path in an **unweighted** graph — BFS or DFS?",
    options: [
      "DFS — goes deeper faster",
      "BFS — the first time you reach a node, that distance is the shortest (in edges)",
      "Either, doesn't matter",
      "Dijkstra"
    ],
    answer: 1 },

  { id: 't04', section: 'Trade-offs', difficulty: 'hard', type: 'mc',
    prompt: "Greedy gives the wrong answer but DP works. Which is the canonical example?",
    options: [
      "Activity selection (max non-overlapping intervals)",
      "Coin Change min coins for arbitrary denominations (e.g. `[1, 3, 4]` to make 6 — greedy picks 4+1+1=3, DP finds 3+3=2)",
      "Kruskal's MST",
      "Huffman coding"
    ],
    answer: 1 },

  { id: 't05', section: 'Trade-offs', difficulty: 'medium', type: 'mc',
    prompt: "You're storing ~10M key/value pairs in JS and need both **O(1) lookup** and **insertion-ordered iteration**. Which structure?",
    options: [
      "Plain Object",
      "Map — guarantees insertion-order iteration and O(1) operations",
      "Set",
      "Array of `[k, v]` pairs"
    ],
    answer: 1 },

  { id: 't06', section: 'Trade-offs', difficulty: 'medium', type: 'mc',
    prompt: "Recursion vs iteration for tree/graph traversal. When does iteration (explicit stack/queue) **clearly win**?",
    options: [
      "Always faster than recursion",
      "When the depth could exceed the JS call-stack limit (~10K frames in V8) and you'd otherwise stack-overflow",
      "Only when the tree is balanced",
      "Only when the values are primitives"
    ],
    answer: 1 },

  // -------------------- PART 4: EDGE CASES / GOTCHAS (5) --------------------
  { id: 'e01', section: 'Edge Cases', difficulty: 'easy', type: 'mc',
    prompt: "What does `[10, 2, 5].sort()` return?",
    options: [
      "`[2, 5, 10]`",
      "`[10, 5, 2]`",
      "`[10, 2, 5]` — default sort is lexical, so `\"10\" < \"2\" < \"5\"`",
      "Throws a TypeError"
    ],
    answer: 2,
    rationale: "Need `arr.sort((a,b) => a - b)` for numeric sort." },

  { id: 'e02', section: 'Edge Cases', difficulty: 'hard', type: 'mc',
    prompt: "Binary search: `while (lo < hi)` vs `while (lo <= hi)`. Which statement is correct?",
    options: [
      "They're interchangeable",
      "`<=` pairs with `hi = mid - 1` and `lo = mid + 1` (closed interval); `<` pairs with `hi = mid` (half-open). Mixing them is the #1 binary-search bug.",
      "Only `<` terminates",
      "Only `<=` works on rotated arrays"
    ],
    answer: 1 },

  { id: 'e03', section: 'Edge Cases', difficulty: 'easy', type: 'mc',
    prompt: "DFS on a graph that may contain cycles. What's the gotcha if you forget one thing?",
    options: [
      "Stack overflow only",
      "**Infinite loop** without a `visited` set — DFS will keep revisiting nodes in the cycle",
      "Returns wrong path length",
      "Doesn't work — must use BFS"
    ],
    answer: 1 },

  { id: 'e04', section: 'Edge Cases', difficulty: 'hard', type: 'mc',
    prompt: "Sliding window with shrink-from-left works for \"longest subarray with sum ≤ K\" on **non-negative** arrays. Why does the vanilla approach **break** if the array can contain negatives?",
    options: [
      "Window sum is no longer monotonic as you grow the window, so shrinking from the left no longer guarantees progress toward the condition",
      "Hash collisions",
      "It still works — no difference",
      "Only the window size is affected"
    ],
    answer: 0,
    rationale: "With negatives, you need prefix-sum + deque (or other tricks) instead of vanilla sliding window." },

  { id: 'e05', section: 'Edge Cases', difficulty: 'medium', type: 'mc',
    prompt: "You recurse over a 10K-deep linked list (one long chain). What happens in JS?",
    options: [
      "Nothing — JS does tail-call optimization",
      "**Stack overflow** — JS engines don't implement TCO in practice; rewrite iteratively",
      "GC pause",
      "Wrong answer"
    ],
    answer: 1 },

  // -------------------- PART 5: TRACE / PREDICT (4) --------------------
  { id: 'r01', section: 'Trace', difficulty: 'easy', type: 'mc',
    prompt: "What does this print?",
    code: `const arr = [1, 2, 3, 4];
let s = 0;
for (let i = 0; i < arr.length; i++) {
  if (arr[i] % 2 === 0) s += arr[i];
}
console.log(s);`,
    options: ["4", "6", "10", "0"],
    answer: 1 },

  { id: 'r02', section: 'Trace', difficulty: 'easy', type: 'mc',
    prompt: "What does `f([3, 1, 4, 1, 5])` return?",
    code: `function f(a) {
  const seen = new Set();
  for (const x of a) {
    if (seen.has(x)) return true;
    seen.add(x);
  }
  return false;
}`,
    options: ["true (1 repeats)", "false", "throws", "undefined"],
    answer: 0 },

  { id: 'r03', section: 'Trace', difficulty: 'medium', type: 'mc',
    prompt: "Time complexity of `g(arr)` in terms of N = arr.length?",
    code: `function g(arr) {
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      out.push(arr[i] + arr[j]);
    }
  }
  return out;
}`,
    options: ["O(N)", "O(N log N)", "O(N²)", "O(2^N)"],
    answer: 2 },

  { id: 'r04', section: 'Trace', difficulty: 'hard', type: 'mc',
    prompt: "Spot the bug in this binary search:",
    code: `function binSearch(arr, target) {
  let lo = 0, hi = arr.length - 1;
  while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (arr[mid] === target) return mid;
    if (arr[mid] < target) lo = mid + 1;
    else hi = mid - 1;
  }
  return -1;
}`,
    options: [
      "No bug",
      "Loop condition should be `lo <= hi`. With `lo < hi`, when `lo === hi` (single remaining element) the loop exits without checking it.",
      "`mid` calculation overflows",
      "Comparison should be `arr[mid] > target` not `<`"
    ],
    answer: 1 },

  // -------------------- PART 6: SHORT-ANSWER / INSIGHT (10) --------------------
  { id: 's01', section: 'Insight', difficulty: 'medium', type: 'short',
    prompt: "In ≤2 sentences: what's the **key insight** that makes Kadane's algorithm (max subarray sum) O(N)?",
    rubric: "Should mention: running sum is reset (to 0 or to current element) whenever it goes negative, because a negative prefix can only hurt future windows. Max-so-far is tracked separately." },

  { id: 's02', section: 'Insight', difficulty: 'medium', type: 'short',
    prompt: "In ≤2 sentences: why does the **fast/slow pointer** technique detect a cycle in a linked list?",
    rubric: "In a cycle, fast (2 steps) gains 1 step on slow (1 step) each iteration, so the gap closes by 1 each round — they must collide. If no cycle, fast hits null first." },

  { id: 's03', section: 'Insight', difficulty: 'easy', type: 'short',
    prompt: "What is the **loop invariant** you maintain in binary search? (≤1 sentence)",
    rubric: "The target, if present, always lies in the current search interval [lo, hi] (or [lo, hi) depending on convention)." },

  { id: 's04', section: 'Insight', difficulty: 'hard', type: 'short',
    prompt: "**Real-world**: you have a 100M-line log file and 4GB RAM. You need to find duplicate lines. Sketch your approach in 2–3 sentences.",
    rubric: "Cannot fit in memory. Options to mention: (a) external sort → linear scan for adjacent dupes, (b) hash-partition by `hash(line) % K` into K chunks small enough to fit, then dedupe each chunk in-memory (dupes always land in the same chunk), (c) Bloom filter if approximate is OK. Bonus: note memory-vs-disk-IO trade-off." },

  { id: 's05', section: 'Insight', difficulty: 'medium', type: 'short',
    prompt: "When you see \"find the K most ___\" — name your **two** go-to data structures, and when you'd pick each. (2–3 sentences)",
    rubric: "(1) Min-heap of size K: O(N log K) time, O(K) space — pick when K ≪ N. (2) Bucket sort by frequency: O(N) time, O(N) space — pick when input has bounded value range (e.g. counts up to N). Honorable mention: quickselect O(N) avg." },

  { id: 's06', section: 'Insight', difficulty: 'easy', type: 'short',
    prompt: "What's the difference between a **subsequence** and a **substring**? Name one classic problem of each type. (1–2 sentences)",
    rubric: "Substring = contiguous (e.g. Longest Substring Without Repeating Characters). Subsequence = order-preserving but non-contiguous (e.g. Longest Common Subsequence, Longest Increasing Subsequence). Substring problems often use sliding window; subsequence problems often use DP." },

  { id: 's07', section: 'Insight', difficulty: 'medium', type: 'short',
    prompt: "You see a problem about \"merging overlapping intervals\" or \"finding free time across schedules\". What's your **first move**, and why? (1–2 sentences)",
    rubric: "Sort by start time (sometimes by end time). After sorting, overlap detection becomes a single sweep: compare current interval to last-merged. Sorting reduces O(n²) pairwise checks to O(n log n + n)." },

  { id: 's08', section: 'Insight', difficulty: 'medium', type: 'short',
    prompt: "You see \"shortest path on an unweighted graph\". Walk through how you set it up in 2–3 sentences.",
    rubric: "BFS from source. Initialize queue with (source, dist=0) and a visited set. Pop front, push unvisited neighbors with dist+1, mark visited. First time you pop the target → answer. Why BFS: all edges have weight 1, so first-discovery distance = shortest distance." },

  { id: 's09', section: 'Insight', difficulty: 'hard', type: 'short',
    prompt: "**Real-world**: design `rateLimit(fn, n, windowMs)` — wraps `fn` so it can be called at most `n` times in any rolling window of `windowMs`. Calls beyond the limit are dropped (or queued — your choice). What data structure holds the call history, and why? (2–3 sentences)",
    rubric: "Deque/queue of call timestamps. On each call: (1) evict timestamps older than `now - windowMs` from the front (they no longer count), (2) check if `queue.length < n` — if yes, push `now` and run `fn`; if no, drop/queue. Deque is right because eviction is from the front and pushes are at the back — both O(1) amortized. Avoid array-based queues with `shift()` (O(n))." },

  { id: 's10', section: 'Insight', difficulty: 'medium', type: 'short',
    prompt: "An interviewer asks you to give the brute-force solution first, even though you've already spotted the optimal one. Why? (1–2 sentences)",
    rubric: "Confirms you understand the problem correctly. Gives a baseline complexity to compare your optimization against. Serves as a fallback — even if the optimization stalls, you have a working solution. Reveals your debugging/optimization process to the interviewer." },
];

// ============================================================================
// PRE/POST CONTEXTUAL QUESTIONS (free text — not auto-graded)
// ============================================================================
const PRE_QUESTIONS = [
  { id: 'pre_lang', label: "Primary language you'll code in for this interview",
    placeholder: "e.g. JavaScript / TypeScript / Python" },
  { id: 'pre_company', label: "Company / industry / interview style (anything you know)",
    placeholder: "e.g. mid-stage fintech startup, 1 algo round + 1 debugging round" },
  { id: 'pre_known_weak', label: "Topics you already KNOW you're rusty on (so I can weight them)",
    placeholder: "e.g. DP, graphs, anything recursive" },
  { id: 'pre_known_strong', label: "Topics you feel solid on (so I deprioritize them)",
    placeholder: "e.g. arrays, hash maps, basic string stuff" },
];

const POST_QUESTIONS = [
  { id: 'post_felt_hardest', label: "Which questions FELT hardest (even if you got them)? List q-ids if you can.",
    placeholder: "e.g. p07, c04, e04" },
  { id: 'post_blind_spots', label: "Anything the diagnostic did NOT cover that you want in the plan?",
    placeholder: "e.g. system-design-lite, behavioral, specific patterns" },
  { id: 'post_format_intel', label: "Any intel on the interview format? (whiteboard / shared editor / repl / live coding pair-style / take-home)",
    placeholder: "e.g. 45-min live coding in a shared editor, can run code" },
];

// ============================================================================
// STATE
// ============================================================================
const STORAGE_KEY = 'jsdrill.diagnostic.v1';
const TOTAL_STEPS = 1 /*intro*/ + 1 /*pre*/ + QUESTIONS.length + 1 /*post*/ + 1 /*done*/;
const PRE_INDEX  = 1;
const Q_START    = 2;
const POST_INDEX = Q_START + QUESTIONS.length;
const DONE_INDEX = POST_INDEX + 1;

const state = load() || {
  startedAt: new Date().toISOString(),
  currentStep: 0,
  pre: {},
  post: {},
  answers: {},       // { qid: { value, skipped, firstAnsweredAt, lastAnsweredAt } }
  timeOnStep: {},    // { step: totalSeconds }
};

let stepEnteredAt = Date.now();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn('save failed', e); }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function commitStepTime() {
  const elapsed = Math.round((Date.now() - stepEnteredAt) / 1000);
  state.timeOnStep[state.currentStep] = (state.timeOnStep[state.currentStep] || 0) + elapsed;
  stepEnteredAt = Date.now();
}

// ============================================================================
// RENDER
// ============================================================================
const $content = document.getElementById('content');
const $stepMeta = document.getElementById('step-meta');
const $progressBar = document.getElementById('progress-bar');
const $prev = document.getElementById('prev-btn');
const $next = document.getElementById('next-btn');
const $skip = document.getElementById('skip-btn');
const $timeMeta = document.getElementById('time-meta');

function render() {
  const s = state.currentStep;
  $progressBar.style.width = `${(s / (TOTAL_STEPS - 1)) * 100}%`;

  if (s === 0)         renderIntro();
  else if (s === PRE_INDEX)  renderPre();
  else if (s >= Q_START && s < POST_INDEX) renderQuestion(s - Q_START);
  else if (s === POST_INDEX) renderPost();
  else if (s === DONE_INDEX) renderDone();

  updateNavButtons();
  updateMeta();
  save();
}

function renderIntro() {
  $content.innerHTML = `
    <div class="intro">
      <h2>4-Day Interview Diagnostic</h2>
      <p>This is a self-paced diagnostic to figure out where your algorithmic skills stand right now,
      so the 4-day plan can be targeted.</p>
      <ul>
        <li><strong>${QUESTIONS.length} questions</strong> — mostly multiple choice, ~10 short-answer.</li>
        <li>~30–45 minutes total. <strong>You can skip any question.</strong></li>
        <li>Sections: pattern recognition, complexity, trade-offs, edge cases, code-trace, insight.</li>
        <li>Your progress is saved to <code>localStorage</code> — you can close the tab and resume later.</li>
        <li>At the end, click <strong>Export</strong> to download a JSON file. Paste/share that with me to grade.</li>
      </ul>
      <p style="margin-top:24px"><strong>Ground rules:</strong></p>
      <ul>
        <li>Don't look anything up. The point is to surface what you actually remember.</li>
        <li>If you genuinely don't know, <strong>skip it</strong> — that's signal. Don't random-guess.</li>
        <li>For short-answer: write fast, don't polish. A scrappy 2-sentence answer is the goal.</li>
      </ul>
      <p style="margin-top:16px;color:var(--muted);font-size:13px">
        Source code is visible (it's a single HTML file) — correct answers and grading rubrics are in there.
        Don't peek; you'd only cheat yourself out of a useful plan.
      </p>
    </div>`;
}

function renderPre() {
  const inputs = PRE_QUESTIONS.map(q => `
    <div class="pre-q">
      <label for="${q.id}">${q.label}</label>
      <input id="${q.id}" type="text" placeholder="${q.placeholder}"
        value="${escapeAttr(state.pre[q.id] || '')}" data-prekey="${q.id}">
    </div>`).join('');
  $content.innerHTML = `
    <h2 style="margin-top:0">A few quick context questions</h2>
    <p style="color:var(--muted)">These help me weight the plan. All optional — leave blank if unsure.</p>
    ${inputs}`;
  $content.querySelectorAll('[data-prekey]').forEach(el => {
    el.addEventListener('input', e => {
      state.pre[e.target.dataset.prekey] = e.target.value;
      save();
    });
  });
}

function renderQuestion(qIdx) {
  const q = QUESTIONS[qIdx];
  const a = state.answers[q.id] || {};
  const totalQs = QUESTIONS.length;

  const codeBlock = q.code ? `<pre>${escapeHtml(q.code)}</pre>` : '';
  const promptHtml = `<div class="prompt">${mdInline(q.prompt)}</div>${codeBlock}`;

  let body = '';
  if (q.type === 'mc') {
    const letters = ['A','B','C','D','E','F'];
    body = `<div class="options">` +
      q.options.map((o, i) => `
        <div class="opt ${a.value === i ? 'selected' : ''}" data-opt-idx="${i}">
          <div class="opt-letter">${letters[i]}</div>
          <div class="opt-body">${mdInline(o)}</div>
        </div>`).join('') +
      `</div>`;
  } else if (q.type === 'short') {
    body = `<textarea data-short="${q.id}" placeholder="2–3 sentences, fast & scrappy is fine…">${
      escapeHtml(typeof a.value === 'string' ? a.value : '')
    }</textarea>
    <div class="hint">Tip: just dump the key idea. Polish doesn't earn points here.</div>`;
  }

  $content.innerHTML = `
    <div>
      <span class="tag">Q${qIdx + 1}/${totalQs}</span>
      <span class="tag">${escapeHtml(q.section)}</span>
      <span class="tag diff-${q.difficulty}">${q.difficulty}</span>
    </div>
    ${promptHtml}
    ${body}
    ${a.skipped ? '<div class="note">Marked as skipped. You can still answer it.</div>' : ''}
    <div class="question-jumper" id="jumper"></div>
  `;

  if (q.type === 'mc') {
    $content.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.optIdx, 10);
        recordAnswer(q.id, idx);
        $content.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
  } else if (q.type === 'short') {
    const ta = $content.querySelector(`[data-short="${q.id}"]`);
    ta.addEventListener('input', () => recordAnswer(q.id, ta.value));
  }

  renderJumper(qIdx);
}

function renderJumper(currentQIdx) {
  const j = document.getElementById('jumper');
  if (!j) return;
  j.innerHTML = QUESTIONS.map((q, i) => {
    const a = state.answers[q.id];
    const cls = ['jump-btn'];
    if (i === currentQIdx) cls.push('current');
    if (a) {
      if (a.skipped) cls.push('skipped');
      else if (a.value !== undefined && a.value !== '' && a.value !== null) cls.push('answered');
    }
    return `<button class="${cls.join(' ')}" data-jump="${i}" title="Q${i+1} (${q.section})">${i+1}</button>`;
  }).join('');
  j.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.jump, 10);
      commitStepTime();
      state.currentStep = Q_START + idx;
      render();
    });
  });
}

function renderPost() {
  const inputs = POST_QUESTIONS.map(q => `
    <div class="pre-q">
      <label for="${q.id}">${q.label}</label>
      <textarea id="${q.id}" placeholder="${q.placeholder}" data-postkey="${q.id}">${
        escapeHtml(state.post[q.id] || '')
      }</textarea>
    </div>`).join('');
  $content.innerHTML = `
    <h2 style="margin-top:0">A few wrap-up questions</h2>
    <p style="color:var(--muted)">Now that you've gone through everything — these calibrate the plan.</p>
    ${inputs}`;
  $content.querySelectorAll('[data-postkey]').forEach(el => {
    el.addEventListener('input', e => {
      state.post[e.target.dataset.postkey] = e.target.value;
      save();
    });
  });
}

function renderDone() {
  const stats = computeStats();
  const rows = Object.entries(stats.bySection).map(([sec, s]) => {
    const pct = s.mcTotal > 0 ? Math.round(100 * s.mcCorrect / s.mcTotal) : null;
    const pill = pct === null ? '<span class="pill">—</span>'
      : pct >= 75 ? `<span class="pill good">${pct}%</span>`
      : pct >= 50 ? `<span class="pill warn">${pct}%</span>`
      : `<span class="pill bad">${pct}%</span>`;
    return `<tr>
      <td>${escapeHtml(sec)}</td>
      <td>${s.mcCorrect}/${s.mcTotal} MC</td>
      <td>${s.shortAnswered}/${s.shortTotal} short</td>
      <td>${s.skipped} skipped</td>
      <td>${pill}</td>
    </tr>`;
  }).join('');

  $content.innerHTML = `
    <h2 style="margin-top:0">Done — export and send to me</h2>
    <p>Auto-scored MC results (short-answer needs me to grade):</p>
    <table class="summary-table">
      <thead><tr><th>Section</th><th>MC</th><th>Short</th><th>Skipped</th><th>MC %</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p><strong>Time:</strong> ${formatTime(stats.totalSeconds)} total.
       <strong>Answered:</strong> ${stats.answered}/${QUESTIONS.length}.
       <strong>Skipped:</strong> ${stats.skipped}.</p>

    <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn good" id="export-btn">⬇ Export JSON</button>
      <button class="btn" id="copy-btn">📋 Copy JSON to clipboard</button>
      <button class="btn" id="restart-btn">Restart (clears saved state)</button>
    </div>
    <p class="hint" style="margin-top:16px">
      Send the JSON to me (paste in chat or attach the file). I'll grade the short answers,
      combine with the MC scores, and write the 4-day plan from there.
    </p>
  `;
  document.getElementById('export-btn').onclick = exportJson;
  document.getElementById('copy-btn').onclick = copyJson;
  document.getElementById('restart-btn').onclick = () => {
    if (confirm("Wipe saved diagnostic state and start over?")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  };
}

function updateNavButtons() {
  const s = state.currentStep;
  $prev.disabled = s === 0;
  $skip.style.display = (s >= Q_START && s < POST_INDEX) ? '' : 'none';
  if (s === DONE_INDEX) {
    $next.style.display = 'none';
  } else {
    $next.style.display = '';
    $next.textContent = s === POST_INDEX ? 'Finish →' : (s === 0 ? 'Begin →' : 'Next →');
  }
}

function updateMeta() {
  const s = state.currentStep;
  if (s === 0) $stepMeta.textContent = 'Intro';
  else if (s === PRE_INDEX) $stepMeta.textContent = 'Context';
  else if (s >= Q_START && s < POST_INDEX) $stepMeta.textContent = `Q ${s - Q_START + 1} / ${QUESTIONS.length}`;
  else if (s === POST_INDEX) $stepMeta.textContent = 'Wrap-up';
  else if (s === DONE_INDEX) $stepMeta.textContent = 'Done';
  $timeMeta.textContent = `Elapsed: ${formatTime(totalElapsedSeconds())}`;
}

// ============================================================================
// HANDLERS
// ============================================================================
$prev.onclick = () => { if (state.currentStep > 0) { commitStepTime(); state.currentStep--; render(); } };
$next.onclick = () => { if (state.currentStep < DONE_INDEX) { commitStepTime(); state.currentStep++; render(); } };
$skip.onclick = () => {
  const qIdx = state.currentStep - Q_START;
  if (qIdx < 0 || qIdx >= QUESTIONS.length) return;
  const q = QUESTIONS[qIdx];
  state.answers[q.id] = { ...(state.answers[q.id] || {}), skipped: true, lastAnsweredAt: new Date().toISOString() };
  commitStepTime();
  state.currentStep++;
  render();
};

function recordAnswer(qid, value) {
  const prior = state.answers[qid] || {};
  state.answers[qid] = {
    value,
    skipped: false,
    firstAnsweredAt: prior.firstAnsweredAt || new Date().toISOString(),
    lastAnsweredAt: new Date().toISOString(),
  };
  save();
}

// keyboard nav: 1-4 picks MC; arrows navigate; s skip
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') $next.click();
  else if (e.key === 'ArrowLeft') $prev.click();
  else if (e.key === 's' || e.key === 'S') $skip.click();
  else if (/^[1-6]$/.test(e.key)) {
    const s = state.currentStep;
    if (s >= Q_START && s < POST_INDEX) {
      const q = QUESTIONS[s - Q_START];
      if (q.type === 'mc') {
        const idx = parseInt(e.key, 10) - 1;
        if (idx < q.options.length) {
          recordAnswer(q.id, idx);
          render();
        }
      }
    }
  }
});

// ============================================================================
// STATS / EXPORT
// ============================================================================
function totalElapsedSeconds() {
  const fromMap = Object.values(state.timeOnStep).reduce((a, b) => a + b, 0);
  const onCurrent = Math.round((Date.now() - stepEnteredAt) / 1000);
  return fromMap + onCurrent;
}

function computeStats() {
  const bySection = {};
  let answered = 0, skipped = 0;
  for (const q of QUESTIONS) {
    if (!bySection[q.section]) bySection[q.section] = { mcCorrect:0, mcTotal:0, shortAnswered:0, shortTotal:0, skipped:0 };
    const sec = bySection[q.section];
    const a = state.answers[q.id];
    if (q.type === 'mc') sec.mcTotal++;
    if (q.type === 'short') sec.shortTotal++;
    if (a && !a.skipped && a.value !== undefined && a.value !== '' && a.value !== null) {
      answered++;
      if (q.type === 'mc' && a.value === q.answer) sec.mcCorrect++;
      if (q.type === 'short') sec.shortAnswered++;
    } else if (a && a.skipped) {
      skipped++;
      sec.skipped++;
    }
  }
  return { bySection, answered, skipped, totalSeconds: totalElapsedSeconds() };
}

function buildExport() {
  commitStepTime();
  const stats = computeStats();
  const detailed = QUESTIONS.map((q, idx) => {
    const a = state.answers[q.id] || {};
    const row = {
      id: q.id, section: q.section, difficulty: q.difficulty, type: q.type,
      prompt: q.prompt,
      timeOnStepSeconds: state.timeOnStep[Q_START + idx] || 0,
    };
    if (q.code) row.code = q.code;
    if (q.type === 'mc') {
      row.options = q.options;
      row.correctIndex = q.answer;
      row.userIndex = a.skipped ? null : (a.value ?? null);
      row.correctAnswer = q.options[q.answer];
      row.userAnswer = (a.skipped || a.value === undefined) ? null : q.options[a.value];
      row.isCorrect = (!a.skipped && a.value === q.answer);
      if (q.rationale) row.rationale = q.rationale;
    } else {
      row.userAnswer = a.skipped ? null : (a.value || null);
      row.gradingRubric = q.rubric;
    }
    row.skipped = !!a.skipped;
    row.firstAnsweredAt = a.firstAnsweredAt || null;
    row.lastAnsweredAt = a.lastAnsweredAt || null;
    return row;
  });

  return {
    diagnosticVersion: 1,
    startedAt: state.startedAt,
    completedAt: new Date().toISOString(),
    totalElapsedSeconds: stats.totalSeconds,
    totalQuestions: QUESTIONS.length,
    answeredCount: stats.answered,
    skippedCount: stats.skipped,
    preDiagnostic: PRE_QUESTIONS.map(q => ({ id: q.id, label: q.label, response: state.pre[q.id] || null })),
    postDiagnostic: POST_QUESTIONS.map(q => ({ id: q.id, label: q.label, response: state.post[q.id] || null })),
    summaryBySection: stats.bySection,
    responses: detailed,
    instructionsForGrader:
      "Auto-graded fields (MC isCorrect) are reliable. For each short-answer entry, " +
      "compare userAnswer against gradingRubric and score 0/partial/full. Use the " +
      "section-level MC % alongside short-answer quality and pre/post context to design " +
      "the targeted study plan.",
  };
}

function exportJson() {
  const data = buildExport();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const a = document.createElement('a');
  a.href = url;
  a.download = `diagnostic-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function copyJson() {
  const data = buildExport();
  const txt = JSON.stringify(data, null, 2);
  try {
    await navigator.clipboard.writeText(txt);
    const btn = document.getElementById('copy-btn');
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  } catch {
    alert("Clipboard blocked — use Export JSON instead.");
  }
}

// ============================================================================
// UTILS
// ============================================================================
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}
// Tiny inline-markdown subset: **bold** and `code`
function mdInline(s) {
  return escapeHtml(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}
function formatTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}m ${s}s`;
}

// ============================================================================
// BOOT
// ============================================================================
render();
window.addEventListener('beforeunload', () => { commitStepTime(); save(); });
setInterval(() => { updateMeta(); }, 5000); // live elapsed-time tick
</script>
</body>
</html>
