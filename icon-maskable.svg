<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- iter 145 PWA maskable icon. The maskable spec requires content to
       fit inside a 80%-of-the-square safe zone (centered) — OS launchers
       crop the outer 10% on each side for circular / squircle masks.
       Full background fills the square (so the crop never reveals
       transparency); JS wordmark + dot shrunk and re-centered to stay
       within the safe zone (≈ 154x154 centered in the 192x192 frame).
       Same color story as icon.svg. -->
  <rect width="192" height="192" fill="#0f172a"/>
  <text x="96" y="114"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="68" font-weight="700"
        fill="#fbbf24" text-anchor="middle" letter-spacing="-2">JS</text>
  <circle cx="96" cy="142" r="6" fill="#34d399"/>
</svg>
