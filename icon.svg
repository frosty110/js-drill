<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- iter 145 PWA icon. Slate-900 background matching the app's theme.
       Amber-400 "JS" wordmark mirrors the home-screen icon convention
       (high-contrast bold initials). Emerald-400 dot below = the
       state-indicator-chip language the app already uses for progress
       (mastered = green, weakness = amber, etc.) — installed icon
       carries that same visual grammar at-a-glance. Non-maskable variant
       (safe area = full square; no purpose=maskable padding). -->
  <rect width="192" height="192" rx="32" ry="32" fill="#0f172a"/>
  <text x="96" y="118"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="84" font-weight="700"
        fill="#fbbf24" text-anchor="middle" letter-spacing="-2">JS</text>
  <circle cx="96" cy="150" r="7" fill="#34d399"/>
</svg>
