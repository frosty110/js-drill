<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eve Prep">
<title>Eve AI Prep — 4-Day Plan</title>
<!-- CodeMirror runMode for syntax-highlighted static code blocks. Same versions as main app. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<!-- Shared design tokens + storage layer. Source of truth across pages. -->
<link rel="stylesheet" href="tokens.css">
<script src="js/storage.js"></script>
<style>
  :root{
    /* Prep-specific layout vars only — colors live in tokens.css. */
    --tabbar-h: 60px;
    --header-h: 56px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-elevated);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior-y:contain}
  body{min-height:100vh;min-height:100dvh;
    padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom));
    padding-top:var(--safe-top)}
  code{background:#0b1220;padding:1px 6px;border-radius:3px;
    font:0.85em ui-monospace,SFMono-Regular,Menlo,monospace;color:#fde68a}
  pre{background:#0b1220;padding:14px;border-radius:8px;overflow-x:auto;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#e2e8f0;
    margin:10px 0;-webkit-overflow-scrolling:touch;
    white-space:pre-wrap;word-break:break-word}
  pre code{background:none;padding:0;color:inherit;font:inherit;
    white-space:inherit;word-break:inherit}
  /* Mobile: kill the horizontal scrollbar entirely. pre-wrap above wraps
     long lines; this hides any residual scroll affordance for code blocks. */
  @media (max-width:767px){
    pre,.cm-host pre{overflow-x:hidden}
  }

  /* HEADER */
  header{position:sticky;top:0;z-index:50;background:rgba(15,23,42,0.95);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--panel-2);padding:10px 16px;
    height:var(--header-h);display:flex;align-items:center;gap:12px}
  .brand{font-size:14px;font-weight:600;flex-shrink:0;letter-spacing:-0.01em}
  .brand .accent{color:var(--accent)}
  .hdr-progress{flex:1;height:6px;background:var(--panel);border-radius:3px;
    overflow:hidden;min-width:80px}
  .hdr-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));
    width:0;transition:width .3s}
  .hdr-pct{font-size:12px;color:var(--muted);min-width:36px;text-align:right;
    font-variant-numeric:tabular-nums}

  /* MAIN */
  main{padding:14px 14px 28px;max-width:760px;margin:0 auto}

  /* TAB BAR */
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(15,23,42,0.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--panel-2);
    height:calc(var(--tabbar-h) + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);
    display:flex;justify-content:space-around;align-items:stretch}
  .tab{flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:6px 4px;cursor:pointer;font:11px inherit;
    transition:color .15s;min-height:44px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent)}
  .tab .icon{font-size:20px;line-height:1}
  .tab .label{font-size:10px;font-weight:500;letter-spacing:0.02em;text-transform:uppercase}

  /* DAY PICKER */
  .day-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;
    margin:0 -14px 14px;padding-left:14px;padding-right:14px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .day-strip::-webkit-scrollbar{display:none}
  .day-chip{flex-shrink:0;background:var(--panel);border:1.5px solid transparent;
    border-radius:10px;padding:10px 14px;min-width:88px;cursor:pointer;
    color:var(--muted);text-align:left;transition:all .15s;font-family:inherit}
  .day-chip:hover{background:var(--panel-2)}
  .day-chip.active{background:var(--panel-2);border-color:var(--accent);color:var(--text)}
  .day-chip.today{position:relative}
  .day-chip.today::after{content:'';position:absolute;top:6px;right:8px;
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 6px var(--accent)}
  .day-chip .day-num{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.05em;font-weight:500}
  .day-chip.active .day-num{color:var(--accent)}
  .day-chip .day-date{font-size:13px;font-weight:600;color:inherit;margin-top:2px}
  .day-chip .day-prog{font-size:11px;color:var(--dim);margin-top:4px;
    font-variant-numeric:tabular-nums}

  /* DAY HEADER */
  .day-title{font-size:22px;font-weight:700;margin:8px 0 4px;letter-spacing:-0.02em}
  .day-subtitle{color:var(--muted);font-size:14px;margin-bottom:14px}
  .day-progress{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .day-progress-bar{flex:1;height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
  .day-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));
    transition:width .3s;border-radius:4px}
  .day-progress-text{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
    min-width:60px;text-align:right}

  /* BLOCK */
  .block{background:var(--panel);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .block-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;
    gap:10px;user-select:none;-webkit-user-select:none}
  .block-header:hover{background:var(--panel-2)}
  .block-caret{font-size:14px;color:var(--muted);transition:transform .2s;
    width:16px;text-align:center;flex-shrink:0}
  .block.expanded .block-caret{transform:rotate(90deg)}
  .block-title-wrap{flex:1;min-width:0}
  .block-title{font-size:15px;font-weight:600;color:var(--text)}
  .block-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .block-prog-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;
    background:var(--panel-3);color:var(--text);font-variant-numeric:tabular-nums;
    flex-shrink:0}
  .block-prog-pill.complete{background:var(--good);color:#0f172a}
  .block-body{display:none;padding:0 12px 12px}
  .block.expanded .block-body{display:block}

  /* TASK */
  .task{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;
    border-radius:8px;background:var(--bg-elevated);margin-top:6px}
  .task.done{opacity:0.55}
  .task-check{flex-shrink:0;width:24px;height:24px;border-radius:6px;
    border:2px solid var(--panel-3);background:transparent;cursor:pointer;
    position:relative;transition:all .15s;margin-top:1px;
    appearance:none;-webkit-appearance:none;padding:0}
  .task-check:hover{border-color:var(--accent)}
  .task-check:checked{background:var(--good);border-color:var(--good)}
  .task-check:checked::after{content:'✓';position:absolute;color:#0f172a;
    font-weight:bold;font-size:16px;line-height:20px;
    left:50%;top:50%;transform:translate(-50%,-50%)}
  .task-body{flex:1;min-width:0}
  .task-label{font-size:14px;line-height:1.45;color:var(--text)}
  .task.done .task-label{text-decoration:line-through;color:var(--muted)}
  .task-meta{display:flex;gap:8px;align-items:center;margin-top:6px;
    flex-wrap:wrap}
  .task-mins{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .task-lesson{font-size:11px;background:var(--panel-2);color:var(--muted);
    padding:2px 7px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .task-open{font-size:11px;background:var(--accent);color:#0f172a;
    padding:4px 10px;border-radius:5px;border:none;font-weight:600;
    cursor:pointer;font-family:inherit;transition:background .15s}
  .task-open:hover{background:var(--accent-hover)}
  .task-applauto{font-size:10px;background:#14532d;color:#bbf7d0;padding:2px 6px;
    border-radius:4px;font-weight:500}

  /* CHECKPOINTS */
  .checkpoints{background:var(--panel);border-radius:12px;padding:14px 16px;
    margin-top:16px;border-left:3px solid var(--good)}
  .checkpoints-title{font-size:12px;color:var(--good);text-transform:uppercase;
    letter-spacing:0.05em;font-weight:600;margin-bottom:8px}
  .checkpoints ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
  .checkpoints li{margin:4px 0}

  /* BIG ROCKS BANNER */
  .big-rocks{background:linear-gradient(135deg,rgba(249,115,22,0.12),rgba(249,115,22,0.03));
    border:1px solid rgba(249,115,22,0.3);border-radius:12px;padding:14px 16px;
    margin-bottom:14px}
  .big-rocks-title{font-size:11px;color:var(--rock);text-transform:uppercase;
    letter-spacing:0.06em;font-weight:700;margin-bottom:8px}
  .big-rocks ol{margin:0;padding-left:20px;font-size:13px;color:var(--text);
    line-height:1.55}
  .big-rocks li{margin:4px 0}
  .big-rocks li strong{color:var(--rock)}

  /* CHEATSHEET / GLOSSARY / CODE */
  .section-title{font-size:20px;font-weight:700;margin:14px 0 4px;letter-spacing:-0.02em}
  .section-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .shape{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:14px}
  .shape-head{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;gap:10px}
  .shape-title{font-size:15px;font-weight:600;color:var(--text)}
  .copy-btn{background:var(--panel-2);color:var(--text);border:none;border-radius:5px;
    padding:5px 10px;font:11px inherit;cursor:pointer;font-weight:500;transition:background .15s}
  .copy-btn:hover{background:var(--panel-3)}
  .copy-btn.copied{background:var(--good);color:#0f172a}
  .shape-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;
    padding:0 4px}

  /* GLOSSARY */
  .gloss-search{width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--panel-2);border-radius:8px;padding:12px 14px;
    font:15px inherit;margin-bottom:14px;-webkit-appearance:none}
  .gloss-search:focus{outline:none;border-color:var(--accent)}
  .gloss-card{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:10px}
  .gloss-term{font-size:15px;font-weight:600;color:var(--accent);margin-bottom:6px}
  .gloss-def{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:8px}
  .gloss-where{font-size:12px;color:var(--muted);line-height:1.45;
    padding-top:8px;border-top:1px solid var(--panel-2)}
  .gloss-where::before{content:'Where: ';font-weight:600;color:var(--dim)}
  .no-results{color:var(--muted);text-align:center;padding:30px;font-size:14px}

  /* CHEAT TABLE */
  .cheat-table{width:100%;border-collapse:collapse;background:var(--panel);
    border-radius:10px;overflow:hidden}
  .cheat-table th,.cheat-table td{padding:10px 12px;text-align:left;
    border-bottom:1px solid var(--panel-2);font-size:13px;vertical-align:top}
  .cheat-table th{background:var(--panel-2);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:0.04em;color:var(--muted)}
  .cheat-table tr:last-child td{border-bottom:none}
  .cheat-table td:first-child{color:var(--accent);font-weight:500}

  /* INTERVIEW BEHAVIOR */
  .behavior-card{background:var(--panel);border-radius:12px;padding:14px 16px;
    margin-bottom:10px;border-left:3px solid var(--accent)}
  .behavior-num{font-size:11px;color:var(--accent);font-weight:700;
    letter-spacing:0.05em;margin-bottom:4px}
  .behavior-title{font-size:15px;font-weight:600;margin-bottom:6px}
  .behavior-body{font-size:13px;color:var(--muted);line-height:1.55}

  /* SETTINGS */
  .settings-row{display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;background:var(--panel);border-radius:10px;margin-bottom:8px}
  .settings-label{font-size:14px}
  .settings-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .settings-btn{background:var(--panel-2);color:var(--text);border:none;
    border-radius:6px;padding:8px 14px;font:13px inherit;cursor:pointer;
    font-weight:500;transition:background .15s}
  .settings-btn:hover{background:var(--panel-3)}
  .settings-btn.danger{background:#7f1d1d;color:#fecaca}
  .settings-btn.danger:hover{background:#991b1b}

  /* PER-ITEM REVIEW CHECKBOX */
  .item-row{display:flex;align-items:flex-start;gap:10px}
  .item-check{flex-shrink:0;width:22px;height:22px;border-radius:5px;
    border:2px solid var(--panel-3);background:transparent;cursor:pointer;
    position:relative;transition:all .15s;margin-top:2px;
    appearance:none;-webkit-appearance:none;padding:0}
  .item-check:hover{border-color:var(--accent)}
  .item-check:checked{background:var(--good);border-color:var(--good)}
  .item-check:checked::after{content:'✓';position:absolute;color:#0f172a;
    font-weight:bold;font-size:15px;line-height:18px;
    left:50%;top:50%;transform:translate(-50%,-50%)}
  .item-body{flex:1;min-width:0}
  .review-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
    margin-left:auto;background:var(--panel);padding:3px 8px;border-radius:10px;
    flex-shrink:0}
  .section-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:14px 0 4px}
  .section-title-row .section-title{margin:0;flex:1;min-width:0}

  /* DAILY REVIEW CARD (on Today tab) */
  .review-promo{background:linear-gradient(135deg,rgba(56,189,248,0.14),rgba(34,197,94,0.06));
    border:1px solid rgba(56,189,248,0.35);border-radius:12px;padding:16px;
    margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .review-promo-icon{font-size:24px;flex-shrink:0}
  .review-promo-body{flex:1;min-width:140px}
  .review-promo-title{font-size:14px;font-weight:700;color:var(--accent)}
  .review-promo-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .review-promo button{background:var(--accent);color:#0f172a;border:none;
    padding:10px 16px;border-radius:7px;font:13px inherit;font-weight:600;
    cursor:pointer;flex-shrink:0}
  .review-promo button:hover{background:var(--accent-hover)}
  .review-promo.empty{background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.3)}
  .review-promo.empty .review-promo-title{color:var(--good)}

  /* DAILY REVIEW SESSION (full-view takeover) */
  .review-session{background:var(--panel);border-radius:12px;padding:18px;
    min-height:60vh;display:flex;flex-direction:column}
  .review-progress{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .review-progress-bar{flex:1;height:6px;background:var(--bg-elevated);border-radius:3px;overflow:hidden}
  .review-progress-fill{height:100%;background:var(--accent);transition:width .25s}
  .review-progress-text{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .review-type-pill{display:inline-block;font-size:10px;text-transform:uppercase;
    letter-spacing:0.05em;padding:3px 8px;border-radius:4px;background:var(--panel-2);
    color:var(--accent);font-weight:600;margin-bottom:10px}
  .review-prompt{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:12px}
  .review-prompt-sub{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .review-answer{background:var(--bg-elevated);border-radius:8px;padding:14px;margin:12px 0;
    border-left:3px solid var(--good);font-size:14px;line-height:1.55}
  .review-answer .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--good);font-weight:600;margin-bottom:6px;display:block}
  .review-actions{margin-top:auto;padding-top:20px;display:flex;gap:10px;flex-wrap:wrap}
  .review-actions button{flex:1;min-width:120px;padding:14px;border-radius:8px;
    border:none;font:14px inherit;font-weight:600;cursor:pointer;
    transition:transform .1s, background .15s}
  .review-actions button:active{transform:scale(0.98)}
  .review-peek{background:var(--panel-2);color:var(--text)}
  .review-peek:hover{background:var(--panel-3)}
  .review-fuzzy{background:#7f1d1d;color:#fecaca}
  .review-fuzzy:hover{background:#991b1b}
  .review-gotit{background:var(--good);color:#0f172a}
  .review-gotit:hover{background:#4ade80}
  .review-exit{background:none;color:var(--muted);border:none;cursor:pointer;
    font:13px inherit;padding:6px;align-self:flex-start;margin-bottom:6px}
  .review-summary{text-align:center;padding:30px 12px}
  .review-summary-pct{font-size:48px;font-weight:700;color:var(--good);
    font-variant-numeric:tabular-nums;line-height:1}
  .review-summary-label{color:var(--muted);font-size:14px;margin-top:6px}
  .review-summary-stats{display:flex;justify-content:center;gap:18px;margin:18px 0}
  .review-summary-stat{text-align:center}
  .review-summary-stat .num{font-size:22px;font-weight:600}
  .review-summary-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}

  /* CodeMirror inside prep page — match main app's dracula theme + mobile readability */
  .cm-host{margin:10px 0;border-radius:8px;overflow:hidden}
  .cm-host .CodeMirror{height:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:6px 0;background:#282a36}
  .cm-host .CodeMirror-scroll{min-height:0;max-width:100%;-webkit-overflow-scrolling:touch}
  @media (min-width:768px){
    .cm-host .CodeMirror{font-size:14px}
  }

  /* DESKTOP TWEAKS */
  @media (min-width:768px){
    :root{--header-h:64px}
    main{padding:24px 24px 40px}
    .day-title{font-size:28px}
    .gloss-card,.shape{padding:18px}
    .behavior-card{padding:18px 20px}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="accent">Eve</span> Prep</div>
  <div class="hdr-progress"><div class="hdr-progress-bar" id="hdrBar"></div></div>
  <div class="hdr-pct" id="hdrPct">0%</div>
</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar"></nav>

<script>
// ============================================================================
// PLAN DATA
// ============================================================================
const PLAN = {
  startIso: '2026-05-24',
  days: [
    {
      id: 1, title: 'Foundations & gap-fills',
      date: 'Sat, May 24', iso: '2026-05-24',
      blocks: [
        { id: 'd1m', title: 'Morning — Clear the 5 big rocks', duration: '~2 hr',
          tasks: [
            { id: 'd1m-1', label: 'Read the Glossary tab — out loud, twice. Especially: monotonic, in/pre/post-order, substring vs subsequence.', mins: 30 },
            { id: 'd1m-2', label: 'Write each of the 6 Must-Know Code Shapes (Code tab) on paper from memory. Compare to cheatsheet. Repeat anything you got wrong.', mins: 30 },
            { id: 'd1m-3', label: 'JS sort gotcha — re-drill', mins: 10, lesson: { id: 'sorting', title: 'Sort with comparator' } },
            { id: 'd1m-4', label: 'Binary Search — re-read invariants carefully', mins: 15, lesson: { id: 'binary-search', title: 'Binary Search' } },
            { id: 'd1m-5', label: 'BFS queue scaffold — drill', mins: 10, lesson: { id: 's-bfs-template', title: 'BFS queue scaffold' } },
            { id: 'd1m-6', label: 'Pre/in/post-order traversal — say each out loud', mins: 10, lesson: { id: 's-tree-traversals', title: 'Pre/in/post-order traversal' } },
            { id: 'd1m-7', label: "Kadane's algo — you don't know it; learn it now", mins: 15, lesson: { id: 'p-max-subarray', title: "Maximum Subarray (Kadane's)" } },
            { id: 'd1m-8', label: 'Re-read your wrong answers in the diagnostic JSON; say "ah" out loud for each.', mins: 15 },
          ]},
        { id: 'd1a', title: 'Afternoon — Arrays & Hashing + Two Pointers', duration: '~3 hr',
          tasks: [
            { id: 'd1a-1', label: 'L1+L2+L3', lesson: { id: 'two-sum', title: 'Two Sum (hash map)' } },

const GLOSSARY = [
  { term: 'monotonic', def: 'Always moving in one direction — non-decreasing or non-increasing. A monotonic stack only keeps elements in sorted order; popping smaller-than-current ones.', where: 'Daily Temperatures, Sliding Window Maximum, Largest Rectangle in Histogram. Also: sliding window only works cleanly when the window-sum is monotonic as you grow it (breaks with negatives).' },
  { term: 'insertion-ordered iteration', def: 'When you iterate a structure, you get items back in the order you inserted them. Map and Set guarantee this; plain Object historically did not (now mostly does, but with weird rules for integer-like keys).', where: '"I need to remember the order users were added" → use Map, not Object.' },
  { term: 'loop invariant', def: 'A statement that is true at the start of every iteration of a loop. The contract that proves the algorithm works.', where: 'Binary search: "if the target exists, it is in [lo, hi]." Two-pointer: "all valid pairs lie between left and right."' },
  { term: 'trie (prefix tree)', def: 'A tree where each node represents one character, and paths from root spell out words. Lookups by prefix are O(prefix length) regardless of dictionary size.', where: 'Autocomplete, spellcheck, "does any word in this dictionary start with X?", IP routing tables. For Eve AI: legal-term suggestion.' },
  { term: 'BFS (Breadth-First Search)', def: 'Explore neighbors level by level. Uses a queue. First time you reach a node = shortest path (in edges).', where: 'Shortest path in unweighted graph. Level-order tree traversal. Spreading infection / fire / water.' },
  { term: 'DFS (Depth-First Search)', def: 'Explore as deep as possible before backtracking. Uses recursion or an explicit stack.', where: 'Counting connected components. Reachability. Tree traversals (in/pre/post). Cycle detection. Topological sort.' },
  { term: 'in-order / pre-order / post-order', def: 'Tree DFS traversal orderings. Pre-order: node → left → right. In-order: left → node → right (yields sorted output on a BST). Post-order: left → right → node (used when children\'s results feed the parent — e.g. tree height, deletion).', where: 'BST → in-order gives sorted. Tree height → post-order. Serializing → pre-order.' },
  { term: 'topological sort', def: 'Linear ordering of a DAG (directed acyclic graph) such that every edge u → v has u before v. Detects cycles as a side effect.', where: 'Course schedule. Build dependency resolution. Spreadsheet recalc order.' },
  { term: "Dijkstra's algorithm", def: 'Shortest path on a weighted graph with non-negative weights. BFS + priority queue.', where: 'Maps/routing. Network latency. NOT needed for unweighted graphs (BFS is enough there).' },
  { term: 'Union-Find (DSU)', def: 'A structure for "are these two things in the same group?" with union(a,b) and find(a) operations. Near-O(1) amortized.', where: 'Number of connected components. Detecting cycle in undirected graph. Kruskal\'s MST.' },
  { term: 'DP (dynamic programming)', def: 'Break a problem into overlapping subproblems, store each result so you do not recompute. Either top-down (memoized recursion) or bottom-up (fill a table).', where: 'Coin change, edit distance, longest common subsequence, knapsack.' },
  { term: 'substring', def: 'A contiguous chunk of a string. "abc" has substrings "", "a", "ab", "abc", "b", "bc", "c".', where: 'Longest substring without repeating chars (sliding window).' },
  { term: 'subsequence', def: 'An ordered selection of characters, NOT necessarily contiguous. "ace" is a subsequence of "abcde".', where: 'Longest common subsequence (DP). Longest increasing subsequence.' },
  { term: 'prefix sum', def: 'An array where prefix[i] = arr[0] + ... + arr[i]. Lets you compute the sum of any range in O(1).', where: 'Range-sum queries. Sliding window over arrays that may contain negatives.' },
  { term: 'deque (double-ended queue)', def: 'A queue you can push/pop from BOTH ends in O(1). In JS, fake one with an array + index pointers, or use array carefully.', where: 'Rate limiter (evict front, push back). Sliding window maximum (monotonic deque).' },
  { term: 'time / space complexity', def: 'Big-O cost of an algorithm. TIME: how many operations as input N grows. SPACE: what is the maximum additional memory the algorithm might hold at once? Not the average. Not the typical. The worst-case simultaneous storage. The input itself doesn\'t count — only auxiliary storage you allocate.', where: 'Every interview problem ends with "what\'s the complexity?" Always state BOTH. "O(N) time, O(N) space." Recursion counts toward space (call stack depth). A hash set that grows with input is O(N). Two pointers over an array is O(1) space.' },
];

const CODE_SHAPES = [
  {
    title: '1. Binary Search (closed interval)',
    code: `function binarySearch(arr, target) {
  let lo = 0, hi = arr.length - 1;
  while (lo <= hi) {                        // closed: <= because hi is inclusive
    const mid = lo + ((hi - lo) >> 1);      // overflow-safe (matters in other langs)
    if (arr[mid] === target) return mid;
    if (arr[mid] < target) lo = mid + 1;
    else hi = mid - 1;
  }
  return -1;
}`,
    note: 'Invariant: if target exists in arr, it is always in arr[lo..hi]. After the loop, lo === hi + 1, so target wasn\'t there.',
  },
  {
    title: '2. BFS (graph or tree level-order)',
    code: `function bfs(start, getNeighbors) {
  const queue = [start];
  const visited = new Set([start]);
  while (queue.length) {
    const node = queue.shift();              // ok for small; use deque for large
    for (const next of getNeighbors(node)) {
      if (!visited.has(next)) {
        visited.add(next);
        queue.push(next);
      }
    }
  }
}`,
    note: 'For LEVEL-ORDER on a tree: capture queue.length at the top of each iteration — that\'s the number of nodes in the current level.',
  },
  {
    title: '3. DFS recursive',
    code: `function dfs(node, visited = new Set()) {
  if (!node || visited.has(node)) return;
  visited.add(node);
  // pre-order work HERE (before recursing)
  for (const next of node.neighbors) dfs(next, visited);
  // post-order work HERE (after recursing — used for "bubble up" answers like tree height)
}`,
    note: 'Pre-order: work BEFORE children. Post-order: work AFTER children — needed when the parent\'s result depends on the children\'s results (e.g. tree height = 1 + max(left, right)).',
  },
  {
    title: '4. Sliding Window (variable size)',
    code: `function longestGoodWindow(arr, isValid) {
  let left = 0, best = 0;
  // state describing the current window (set, map, sum, count — depends on problem)
  const state = {};
  for (let right = 0; right < arr.length; right++) {
    add(arr[right], state);
    while (!isValid(state)) {                // shrink from left until valid again
      remove(arr[left], state);
      left++;
    }
    best = Math.max(best, right - left + 1);
  }
  return best;
}`,
    note: 'Works when the "valid window" condition is MONOTONIC as you grow the window. Breaks if growing can both make it more AND less valid (e.g. sums with negatives — use prefix-sum + deque instead).',
  },
  {
    title: '5. Two Pointers (sorted array, pair-sum class)',
    code: `function twoSumSorted(arr, target) {
  let l = 0, r = arr.length - 1;
  while (l < r) {
    const sum = arr[l] + arr[r];
    if (sum === target) return [l, r];
    if (sum < target) l++;                  // need bigger → move left up
    else r--;                               // need smaller → move right down
  }
  return [-1, -1];
}`,
    note: 'Key insight: at each step, you eliminate ALL pairs involving the moved index — that\'s why two pointers is O(n), not O(n²).',
  },
  {
    title: '6. Heap-of-K (for "K most ___" problems)',
    code: `// JS has no built-in heap. In an interview, either implement min-heap quickly
// OR articulate the algorithm and use sorted-array as a stand-in.
//
// Find K largest in a stream:
// - maintain a min-heap of size K
// - on each new value v:
//     if heap.size < K → push v
//     else if v > heap.top → pop + push v
// - end: heap contains the K largest; the root is the K-th largest
//
// Complexity: O(N log K) time, O(K) space.
//
// If you can't implement heap in time, say so:

function getReview(id) { return state.reviewed[id] || { familiarity: 0, lastReviewedAt: 0 }; }
function setReview(id, patch) {
  state.reviewed[id] = { ...getReview(id), ...patch };
  save();
}
function isReviewed(id) { return getReview(id).familiarity >= 1; }
function markReviewedOnce(id) {
  const r = getReview(id);
  setReview(id, { familiarity: Math.max(1, r.familiarity), lastReviewedAt: Date.now() });
}
function unmarkReviewed(id) { setReview(id, { familiarity: 0, lastReviewedAt: 0 }); }
function gradeReview(id, gotIt) {
  const r = getReview(id);
  const nextFam = gotIt ? Math.min(3, r.familiarity + 1) : 0;
  setReview(id, { familiarity: nextFam, lastReviewedAt: Date.now() });
}
function reviewedCount(prefix) {
  return Object.keys(state.reviewed).filter(k => k.startsWith(prefix + ':') && state.reviewed[k].familiarity >= 1).length;
}

function reviewableItems() {
  const out = [];
  for (const g of GLOSSARY) {
    out.push({ id: `g:${g.term}`, type: 'glossary', prompt: g.term,
      answer: g.def, where: g.where });
  }
  for (let i = 0; i < CODE_SHAPES.length; i++) {
    const s = CODE_SHAPES[i];
    out.push({ id: `c:${i}`, type: 'code', prompt: s.title,
      answer: s.code, where: s.note, isCode: true });
  }
  for (let i = 0; i < CHEATSHEET.length; i++) {
    const [trig, pat] = CHEATSHEET[i];
    out.push({ id: `p:${i}`, type: 'pattern', prompt: trig, answer: pat });
  }
  for (let i = 0; i < INTERVIEW_BEHAVIOR.length; i++) {
    const b = INTERVIEW_BEHAVIOR[i];
    out.push({ id: `b:${i}`, type: 'behavior', prompt: b.title, answer: b.body,
      where: b.num });
  }
  for (let i = 0; i < BIG_ROCKS.length; i++) {
    const r = BIG_ROCKS[i];
    out.push({ id: `r:${i}`, type: 'rock', prompt: r.rock, answer: r.detail });
  }
  return out;
}

function dueItems() {
  const now = Date.now();
  return reviewableItems().filter(it => {
    const r = getReview(it.id);
    const intervalMs = SRS_INTERVAL_DAYS[Math.min(r.familiarity, 3)] * 86400000;
    return (now - r.lastReviewedAt) >= intervalMs;
  });
}

function buildDailyReviewQueue() {
  // Bucket due items by type, shuffle each, take up to the sample size, weave together.
  const due = dueItems();
  const buckets = { glossary: [], code: [], pattern: [], behavior: [], rock: [] };
  for (const it of due) buckets[it.type].push(it);
  for (const t in buckets) buckets[t].sort(() => Math.random() - 0.5);
  const picked = [];
  for (const t in buckets) picked.push(...buckets[t].slice(0, REVIEW_SAMPLE[t] || 0));
  // weave so we don't get 5 glossary in a row
  picked.sort(() => Math.random() - 0.5);
  return picked;
}

function isLessonDoneInMainApp(lessonId) {
  if (window.DrillStorage) return window.DrillStorage.isLessonFullyDone(lessonId);
  const l = loadMainAppProgress()[lessonId];
  return !!(l && l.L1 === 'passed' && l.L2 === 'passed' && l.L3 === 'passed');
}
function isLessonPartialInMainApp(lessonId) {
  if (window.DrillStorage) return window.DrillStorage.isLessonPartiallyDone(lessonId);
  const l = loadMainAppProgress()[lessonId];
  return !!(l && (l.L1 === 'passed' || l.L2 === 'passed' || l.L3 === 'passed'));
}

// ============================================================================
// DAY DETECTION
// ============================================================================
function todayIso() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function todayDayId() {
  const today = todayIso();
  for (const day of PLAN.days) {
    if (day.iso === today) return day.id;
  }
  // before the plan starts → Day 1; after → Day 4
  if (today < PLAN.days[0].iso) return 1;
  return PLAN.days[PLAN.days.length - 1].id;
}

// ============================================================================
// TASK / BLOCK / DAY HELPERS
// ============================================================================
function isTaskDone(task) {
  if (state.completed[task.id]) return true;
  if (task.lesson && isLessonDoneInMainApp(task.lesson.id)) return true;
  return false;
}
function blockProgress(block) {
  let done = 0;
  for (const t of block.tasks) if (isTaskDone(t)) done++;
  return { done, total: block.tasks.length };
}
function dayProgress(day) {
  let done = 0, total = 0;
  for (const b of day.blocks) {
    const p = blockProgress(b);
    done += p.done; total += p.total;
  }
  return { done, total };
}
function overallProgress() {
  let done = 0, total = 0;
  for (const d of PLAN.days) {
    const p = dayProgress(d);
    done += p.done; total += p.total;
  }
  return { done, total };
}

// RENDER
// ============================================================================
const $view = document.getElementById('view');
const $tabbar = document.getElementById('tabbar');
const $hdrBar = document.getElementById('hdrBar');
const $hdrPct = document.getElementById('hdrPct');

const TABS = [
  { id: 'today',    icon: '☀',  label: 'Today' },
  { id: 'days',     icon: '📅', label: 'Days' },
  { id: 'cheat',    icon: '⚡', label: 'Cheat' },
  { id: 'glossary', icon: 'A',  label: 'Glossary' },
  { id: 'code',     icon: '〈〉', label: 'Code' },
  { id: 'settings', icon: '⚙',  label: 'Settings' },
];

function renderTabbar() {
  $tabbar.innerHTML = TABS.map(t => `
    <button class="tab ${state.currentTab === t.id ? 'active' : ''}" data-tab="${t.id}">
      <span class="icon">${t.icon}</span>
      <span class="label">${t.label}</span>
    </button>
  `).join('');
  $tabbar.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => { setTab(btn.dataset.tab); };
  });
}

function setTab(tabId) {
  state.currentTab = tabId;
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderHeader() {
  const p = overallProgress();
  const pct = p.total > 0 ? Math.round(100 * p.done / p.total) : 0;
  $hdrBar.style.width = `${pct}%`;
  $hdrPct.textContent = `${pct}%`;
}

function render() {
  renderHeader();
  renderTabbar();
  if (state.currentTab === 'today')         renderToday();
  else if (state.currentTab === 'days')     renderAllDays();
  else if (state.currentTab === 'cheat')    renderCheat();
  else if (state.currentTab === 'glossary') renderGlossary();
  else if (state.currentTab === 'code')     renderCode();
  else if (state.currentTab === 'settings') renderSettings();
  else renderToday();
}

// -------------------- TODAY / DAY --------------------
function renderToday() {
  if (state.review && state.review.queue && state.review.queue.length) {
    renderReviewSession();
    return;
  }
  if (!state.currentDayId) state.currentDayId = todayDayId();
  renderDay(state.currentDayId, /*withStrip*/ true);
}

function renderDay(dayId, withStrip) {
  const day = PLAN.days.find(d => d.id === dayId);
  if (!day) { $view.innerHTML = '<p>Day not found.</p>'; return; }
  const p = dayProgress(day);
  const pct = p.total > 0 ? Math.round(100 * p.done / p.total) : 0;

  const isToday = day.iso === todayIso();
  const isBeforeToday = day.iso < todayIso();
  const isFutureDay = day.iso > todayIso();

  let html = '';

  // Day strip
  if (withStrip) {
    const today = todayIso();
    html += `<div class="day-strip">${PLAN.days.map(d => {
      const dp = dayProgress(d);
      const dpct = dp.total ? Math.round(100 * dp.done / dp.total) : 0;
      const cls = ['day-chip'];
      if (d.id === dayId) cls.push('active');
      if (d.iso === today) cls.push('today');
      return `<button class="${cls.join(' ')}" data-day="${d.id}">
        <div class="day-num">Day ${d.id}</div>
        <div class="day-date">${d.date.split(' —')[0]}</div>
        <div class="day-prog">${dp.done}/${dp.total} · ${dpct}%</div>
      </button>`;
    }).join('')}</div>`;
  }

  // Daily Review promo — always shown at top of Today; counts due items.
  const due = dueItems();
  if (due.length > 0) {
    html += `<div class="review-promo">
      <div class="review-promo-icon">🔁</div>
      <div class="review-promo-body">
        <div class="review-promo-title">Daily Review · ${due.length} items due</div>
        <div class="review-promo-sub">Spaced-rep refresher · glossary, code, cheats, gotchas · ~15–20 min</div>
      </div>
      <button data-action="start-review">Start review</button>
    </div>`;
  } else {
    html += `<div class="review-promo empty">
      <div class="review-promo-icon">✓</div>
      <div class="review-promo-body">
        <div class="review-promo-title">All caught up on review</div>
        <div class="review-promo-sub">Items will resurface as their interval lapses.</div>
      </div>
    </div>`;
  }

  // Big rocks banner (only on Day 1 today)
  if (dayId === 1 && (isToday || isBeforeToday)) {
    html += `<div class="big-rocks">
      <div class="big-rocks-title">5 Big Rocks (from your diagnostic)</div>
      <ol>${BIG_ROCKS.map(r => `<li><strong>${escapeHtml(r.rock)}</strong> — ${escapeHtml(r.detail)}</li>`).join('')}</ol>
    </div>`;
  }

  // Day title + progress
  html += `<div class="day-title">Day ${day.id} — ${escapeHtml(day.title)}</div>
    <div class="day-subtitle">${escapeHtml(day.date)}${isToday ? ' · <span style="color:var(--accent)">today</span>' : ''}</div>
    <div class="day-progress">
      <div class="day-progress-bar"><div class="day-progress-fill" style="width:${pct}%"></div></div>
      <div class="day-progress-text">${p.done}/${p.total} · ${pct}%</div>
    </div>`;

  // Blocks
  for (const block of day.blocks) {
    const bp = blockProgress(block);
    const isExpanded = state.expanded[block.id] !== false; // default expanded
    const cls = ['block'];
    if (isExpanded) cls.push('expanded');
    const isComplete = bp.done === bp.total && bp.total > 0;
    html += `<div class="${cls.join(' ')}">
      <div class="block-header" data-block="${block.id}">
        <span class="block-caret">▶</span>
        <div class="block-title-wrap">
          <div class="block-title">${escapeHtml(block.title)}</div>
          <div class="block-meta">${escapeHtml(block.duration)}</div>
        </div>
        <div class="block-prog-pill ${isComplete ? 'complete' : ''}">${bp.done}/${bp.total}</div>
      </div>
      <div class="block-body">
        ${block.tasks.map(t => renderTaskHtml(t)).join('')}
      </div>
    </div>`;
  }

  // Checkpoints
  html += `<div class="checkpoints">
    <div class="checkpoints-title">End-of-day checkpoints</div>
    <ul>${day.checkpoints.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
  </div>`;

  $view.innerHTML = html;

  // Wire up
  $view.querySelectorAll('[data-day]').forEach(btn => {
    btn.onclick = () => {
      state.currentDayId = parseInt(btn.dataset.day, 10);
      save(); render();
    };
  });
  $view.querySelectorAll('[data-block]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.block;
      state.expanded[id] = state.expanded[id] === false;
      save(); render();
    };
  });
  $view.querySelectorAll('[data-task]').forEach(cb => {
    cb.onclick = (e) => {
      e.stopPropagation();
      const id = cb.dataset.task;
      state.completed[id] = cb.checked;
      save(); render();
    };
  });
  $view.querySelectorAll('[data-open-lesson]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      openLesson(btn.dataset.openLesson);
    };
  });
  const startBtn = $view.querySelector('[data-action="start-review"]');
  if (startBtn) startBtn.onclick = startReview;
}

// -------------------- DAILY REVIEW SESSION --------------------
function startReview() {
  const queue = buildDailyReviewQueue();
  if (!queue.length) return;
  state.review = { queue, index: 0, revealed: false, gotIt: 0, fuzzy: 0,
    queueIds: queue.map(i => i.id) };
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function exitReview() {
  state.review = null;
  save();
  render();
}

function renderReviewSession() {
  const r = state.review;
  const items = r.queue;
  const total = items.length;

  // Done screen
  if (r.index >= total) {
    const total2 = r.gotIt + r.fuzzy;
    const pct = total2 ? Math.round(100 * r.gotIt / total2) : 0;
    $view.innerHTML = `<div class="review-session">
      <div class="review-summary">
        <div class="review-summary-pct">${pct}%</div>
        <div class="review-summary-label">recalled</div>
        <div class="review-summary-stats">
          <div class="review-summary-stat"><div class="num" style="color:var(--good)">${r.gotIt}</div><div class="lbl">got it</div></div>
          <div class="review-summary-stat"><div class="num" style="color:var(--bad)">${r.fuzzy}</div><div class="lbl">fuzzy</div></div>
          <div class="review-summary-stat"><div class="num">${total}</div><div class="lbl">total</div></div>
        </div>
        <p style="color:var(--muted);font-size:13px;line-height:1.55;max-width:380px;margin:18px auto">
          Fuzzy items resurface tomorrow. Got-it items advance one tier and resurface later
          (1 → 2 → 4 days). Mastered items go quiet.
        </p>
        <button class="btn primary" id="reviewDoneBtn" style="background:var(--accent);color:#0f172a;border:none;padding:12px 24px;border-radius:8px;font:14px inherit;font-weight:600;cursor:pointer;margin-top:8px">Back to Today</button>
      </div>
    </div>`;
    document.getElementById('reviewDoneBtn').onclick = exitReview;
    return;
  }

  const it = items[r.index];
  const pct = Math.round(100 * r.index / total);

  let answerHtml = '';
  if (r.revealed) {
    if (it.isCode) {
      answerHtml = `<div class="review-answer">
        <span class="label">Answer</span>
        <div class="cm-host" data-cm-code="${escapeAttr(it.answer)}"></div>
        ${it.where ? `<div style="font-size:12px;color:var(--muted);margin-top:10px">${escapeHtml(it.where)}</div>` : ''}
      </div>`;
    } else {
      answerHtml = `<div class="review-answer">
        <span class="label">Answer</span>
        ${escapeHtml(it.answer)}
        ${it.where ? `<div style="font-size:12px;color:var(--muted);margin-top:8px">${escapeHtml(it.where)}</div>` : ''}
      </div>`;
    }
  }

  const typeLabel = ({ glossary: 'Glossary', code: 'Code shape', pattern: 'Pattern trigger',
    behavior: 'Interview behavior', rock: 'Big rock' })[it.type] || it.type;
  const fam = getReview(it.id).familiarity;
  const tier = fam === 0 ? 'new' : `tier ${fam}`;

  $view.innerHTML = `<div class="review-session">
    <button class="review-exit" id="reviewExitBtn">← Exit review (progress saved)</button>
    <div class="review-progress">
      <div class="review-progress-bar"><div class="review-progress-fill" style="width:${pct}%"></div></div>
      <div class="review-progress-text">${r.index + 1} / ${total}</div>
    </div>
    <div class="review-type-pill">${escapeHtml(typeLabel)} · ${escapeHtml(tier)}</div>
    <div class="review-prompt">${escapeHtml(it.prompt)}</div>
    ${it.type === 'pattern' ? '<div class="review-prompt-sub">Q: What\'s the first pattern you\'d reach for?</div>' : ''}
    ${it.type === 'code' ? '<div class="review-prompt-sub">Q: Can you write this from memory? (Imagine the code in your head before peeking.)</div>' : ''}
    ${it.type === 'glossary' ? '<div class="review-prompt-sub">Q: Define this term in 1 sentence + name one place it shows up.</div>' : ''}
    ${it.type === 'behavior' ? '<div class="review-prompt-sub">Q: Why does this step matter in an interview?</div>' : ''}
    ${it.type === 'rock' ? '<div class="review-prompt-sub">Q: Why is this one of YOUR top 5 gaps?</div>' : ''}
    ${answerHtml}
    <div class="review-actions">
      ${!r.revealed
        ? `<button class="review-peek" id="reviewPeekBtn">Peek 👀</button>`
        : `<button class="review-fuzzy" id="reviewFuzzyBtn">Fuzzy ✗</button>
           <button class="review-gotit" id="reviewGotitBtn">Got it ✓</button>`}
    </div>
  </div>`;

  // Render CodeMirror block if needed
  if (r.revealed && it.isCode) {
    const host = $view.querySelector('[data-cm-code]');
    if (host && window.CodeMirror && window.CodeMirror.runMode) {
      renderCmInto(host, it.answer);
    }
  }

  document.getElementById('reviewExitBtn').onclick = exitReview;
  const peek = document.getElementById('reviewPeekBtn');
  if (peek) peek.onclick = () => { state.review.revealed = true; save(); render(); };
  const fuzzy = document.getElementById('reviewFuzzyBtn');
  if (fuzzy) fuzzy.onclick = () => { gradeReview(it.id, false); state.review.fuzzy++; state.review.index++; state.review.revealed = false; save(); render(); };
  const got = document.getElementById('reviewGotitBtn');
  if (got) got.onclick = () => { gradeReview(it.id, true); state.review.gotIt++; state.review.index++; state.review.revealed = false; save(); render(); };
}

// -------------------- CODEMIRROR HELPER --------------------
function renderCmInto(host, code) {
  host.innerHTML = '';
  const pre = document.createElement('pre');
  pre.className = 'CodeMirror cm-s-dracula';
  // Mobile-friendly: wrap long lines instead of horizontal-scrolling. Phone
  // is the 80% usage surface — horizontal scroll on code blocks hides content
  // behind a swipe that users don't discover.
  const isMobile = window.matchMedia && window.matchMedia('(max-width:767px)').matches;
  pre.style.cssText = `margin:0;padding:10px 12px;background:#282a36;color:#f8f8f2;font:inherit;-webkit-overflow-scrolling:touch;overflow-x:${isMobile ? 'hidden' : 'auto'}`;
  const codeEl = document.createElement('code');
  codeEl.style.cssText = `background:none;padding:0;color:inherit;font:inherit;display:block;white-space:${isMobile ? 'pre-wrap' : 'pre'};word-break:${isMobile ? 'break-word' : 'normal'}`;
  pre.appendChild(codeEl);
  host.appendChild(pre);
  try {
    window.CodeMirror.runMode(code, 'javascript', codeEl);
  } catch (e) {
    codeEl.textContent = code;
  }
}

function renderTaskHtml(t) {
  const done = isTaskDone(t);
  const autoDone = !state.completed[t.id] && t.lesson && isLessonDoneInMainApp(t.lesson.id);
  const partial = !done && t.lesson && isLessonPartialInMainApp(t.lesson.id);
  return `<div class="task ${done ? 'done' : ''}">
    <input type="checkbox" class="task-check" data-task="${t.id}" ${done ? 'checked' : ''} />
    <div class="task-body">
      <div class="task-label">${escapeHtml(t.label)}${t.lesson ? `: <strong>${escapeHtml(t.lesson.title)}</strong>` : ''}</div>
      <div class="task-meta">
        ${t.mins != null ? `<span class="task-mins">~${t.mins} min</span>` : ''}
        ${t.lesson ? `<span class="task-lesson">${escapeHtml(t.lesson.id)}</span>` : ''}
        ${t.lesson ? `<button class="task-open" data-open-lesson="${escapeAttr(t.lesson.id)}">Open in app</button>` : ''}
        ${autoDone ? '<span class="task-applauto">✓ done in app</span>' : ''}
        ${partial && !autoDone ? '<span class="task-applauto" style="background:#713f12;color:#fde68a">started in app</span>' : ''}
      </div>
    </div>
  </div>`;
}

function openLesson(lessonId) {
  // Bridge to main app: write lastLessonId then navigate.
  // Uses DrillStorage when available (version-aware + defensive against schema
  // drift) and falls back to direct localStorage if the shared layer didn't load.
  try {
    if (window.DrillStorage) {
      window.DrillStorage.setMainLastLessonId(lessonId);
    } else {
      const raw = localStorage.getItem(MAIN_APP_KEY);
      const parsed = raw ? JSON.parse(raw) : { __v: 6 };
      parsed.lastLessonId = lessonId;
      localStorage.setItem(MAIN_APP_KEY, JSON.stringify(parsed));
    }
  } catch (e) {
    console.warn('Could not set lastLessonId:', e);
  }
  window.location.href = 'index.html';
}

// -------------------- ALL DAYS --------------------

  const today = todayIso();
  let html = `<div class="section-title">All 4 days</div>
    <div class="section-sub">Overview of the whole plan. Tap any day to expand it.</div>`;
  for (const day of PLAN.days) {
    const p = dayProgress(day);
    const pct = p.total ? Math.round(100 * p.done / p.total) : 0;

    html += `<div class="block ${isToday ? 'expanded' : ''}">
      <div class="block-header" data-day-jump="${day.id}" style="cursor:pointer">

        <div class="block-title-wrap">

          <div class="block-meta">${escapeHtml(day.date)}</div>
        </div>
        <div class="block-prog-pill ${p.done === p.total ? 'complete' : ''}">${p.done}/${p.total} · ${pct}%</div>

  $view.innerHTML = html;
  $view.querySelectorAll('[data-day-jump]').forEach(el => {
    el.onclick = () => {

      <div class="item-body">

    <div class="review-count">${bReviewed}/${INTERVIEW_BEHAVIOR.length} reviewed</div>
  </div>`;
  html += INTERVIEW_BEHAVIOR.map((b, i) => {
    const id = `b:${i}`;
    return `<div class="behavior-card item-row">
      <input type="checkbox" class="item-check" data-review-id="${escapeAttr(id)}" ${isReviewed(id) ? 'checked' : ''} />
      <div class="item-body">
        <div class="behavior-num">${escapeHtml(b.num)}</div>
        <div class="behavior-title">${escapeHtml(b.title)}</div>
        <div class="behavior-body">${escapeHtml(b.body)}</div>
      </div>
    </div>`;
  }).join('');
  $view.innerHTML = html;
  wireItemChecks();
}

function wireItemChecks() {
  $view.querySelectorAll('[data-review-id]').forEach(cb => {
    cb.onclick = (e) => {
      e.stopPropagation();
      const id = cb.dataset.reviewId;
      if (cb.checked) markReviewedOnce(id);
      else unmarkReviewed(id);
      render();
    };
  });
}

// -------------------- GLOSSARY --------------------
function renderGlossary() {
  const q = (state.glossSearch || '').toLowerCase().trim();
  const matched = q
    ? GLOSSARY.filter(g =>
        g.term.toLowerCase().includes(q) ||
        g.def.toLowerCase().includes(q) ||
        g.where.toLowerCase().includes(q))
    : GLOSSARY;

  const gReviewed = reviewedCount('g');
  let html = `<div class="section-title-row">
      <div class="section-title">Glossary</div>
      <div class="review-count">${gReviewed}/${GLOSSARY.length} reviewed</div>
    </div>
    <div class="section-sub">Terms that blocked you in the diagnostic. Check off each term as you internalize it.</div>
    <input class="gloss-search" id="glossSearch" type="search" placeholder="Search terms or definitions…" value="${escapeAttr(state.glossSearch)}" />`;
  if (!matched.length) {
    html += '<div class="no-results">No matches for that search.</div>';
  } else {
    html += matched.map(g => {
      const id = `g:${g.term}`;
      return `<div class="gloss-card item-row">
        <input type="checkbox" class="item-check" data-review-id="${escapeAttr(id)}" ${isReviewed(id) ? 'checked' : ''} />
        <div class="item-body">
          <div class="gloss-term">${escapeHtml(g.term)}</div>
          <div class="gloss-def">${escapeHtml(g.def)}</div>
          <div class="gloss-where">${escapeHtml(g.where)}</div>
        </div>
      </div>`;
    }).join('');
  }
  $view.innerHTML = html;
  const inp = document.getElementById('glossSearch');
  inp.oninput = () => { state.glossSearch = inp.value; save(); renderGlossary(); };
  // re-focus after re-render to preserve typing
  if (q) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  wireItemChecks();
}

// -------------------- CODE SHAPES --------------------
function renderCode() {
  const cReviewed = reviewedCount('c');
  let html = `<div class="section-title-row">
      <div class="section-title">Must-know code shapes</div>
      <div class="review-count">${cReviewed}/${CODE_SHAPES.length} reviewed</div>
    </div>
    <div class="section-sub">Drill these until you can write all 6 in &lt;2 min each, blind. By Day 3. Check each off when you can write it from memory.</div>`;
  html += CODE_SHAPES.map((s, i) => {
    const id = `c:${i}`;
    return `<div class="shape">
      <div class="shape-head">
        <div class="item-row" style="flex:1;align-items:center">
          <input type="checkbox" class="item-check" data-review-id="${escapeAttr(id)}" ${isReviewed(id) ? 'checked' : ''} />
          <div class="shape-title">${escapeHtml(s.title)}</div>
        </div>
        <button class="copy-btn" data-copy="${i}">Copy</button>
      </div>
      <div class="cm-host" data-cm-idx="${i}"></div>
      <div class="shape-note">${escapeHtml(s.note)}</div>
    </div>`;
  }).join('');
  $view.innerHTML = html;
  // Render syntax-highlighted code into each host (uses CodeMirror runMode like main app)
  CODE_SHAPES.forEach((s, i) => {
    const host = $view.querySelector(`[data-cm-idx="${i}"]`);
    if (host) renderCmInto(host, s.code);
  });
  $view.querySelectorAll('[data-copy]').forEach(btn => {
    btn.onclick = async () => {
      const i = parseInt(btn.dataset.copy, 10);
      try {
        await navigator.clipboard.writeText(CODE_SHAPES[i].code);
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      } catch {
        btn.textContent = 'Failed';
      }
    };
  });
  wireItemChecks();
}

// -------------------- SETTINGS --------------------
function renderSettings() {
  const overall = overallProgress();
  const mainProgKeys = Object.keys(loadMainAppProgress()).length;
  let html = `<div class="section-title">Settings & data</div>
    <div class="section-sub">Manage your prep progress.</div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Overall progress</div>
        <div class="settings-sub">${overall.done} / ${overall.total} tasks done across all 4 days</div>
      </div>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Main-app bridge</div>
        <div class="settings-sub">Reading from ${mainProgKeys} lessons in main app's progress (auto-checks lesson tasks)</div>
      </div>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Export progress</div>
        <div class="settings-sub">Download a JSON snapshot of your prep checkmarks</div>
      </div>
      <button class="settings-btn" id="exportBtn">Export</button>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Reset prep progress</div>
        <div class="settings-sub">Wipes prep checkmarks. Does NOT touch main-app lesson progress.</div>
      </div>
      <button class="settings-btn danger" id="resetBtn">Reset</button>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Diagnostic</div>
        <div class="settings-sub">Re-take the diagnostic before Day 4 to measure improvement</div>
      </div>
      <button class="settings-btn" onclick="window.location.href='diagnostic.html'">Open</button>
    </div>

    <div class="settings-row">
      <div>
        <div class="settings-label">Main drill app</div>
        <div class="settings-sub">All the lesson drills live here</div>
      </div>
      <button class="settings-btn" onclick="window.location.href='index.html'">Open</button>
    </div>

    <div style="margin-top:24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6">
      Add to your iPhone home screen via Share → Add to Home Screen.<br/>
      Progress saves automatically to this browser only.
    </div>
  `;
  $view.innerHTML = html;
  document.getElementById('exportBtn').onclick = () => {
    const data = { exportedAt: new Date().toISOString(), state, mainAppProgress: loadMainAppProgress() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `prep-progress-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Wipe all prep checkmarks? Your main-app lesson progress is NOT touched.')) {
      state.completed = {};
      save(); render();
    }
  };
}

// ============================================================================
// UTILS
// ============================================================================
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ============================================================================
// BOOT
// ============================================================================
if (!state.currentTab) state.currentTab = 'today';
if (!state.currentDayId) state.currentDayId = todayDayId();
render();

// Re-render every 30s so progress auto-updates when user comes back from the main app
setInterval(() => { if (state.currentTab === 'today' || state.currentTab === 'days') render(); }, 30000);

// Refresh when tab regains focus (likely returning from main app)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) render();
});
</script>
