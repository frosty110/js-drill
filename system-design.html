<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design — Memorization Drill</title>
<meta name="description" content="Multiple-choice recall drill for system design books, starting with Designing Data-Intensive Applications.">
<!-- Shared design tokens + storage layer. Source of truth across pages. -->
<link rel="stylesheet" href="tokens.css">
<script src="js/storage.js"></script>
<!-- Optional cross-device sync (Supabase). Skipped at runtime if config missing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/sync.js" defer></script>
<style>
  :root { --bg: var(--bg-elevated); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:15px/1.5 var(--font-sans);-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent-link);text-decoration:none}
  a:hover{text-decoration:underline}
  code{background:#0b1220;padding:1px 5px;border-radius:3px;
    font:.85em var(--font-mono);color:#fde68a}

  /* ── Header ─────────────────────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:12px 16px;border-bottom:1px solid var(--panel-2);
    display:flex;align-items:center;gap:12px}
  header .home-link{display:flex;align-items:center;gap:9px;min-width:0}
  header .badge{font-size:20px;line-height:1}
  header h1{margin:0;font-size:15px;font-weight:600;color:var(--text-strong);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .spacer{flex:1}
  header .hbtn{background:var(--panel-2);color:var(--text);border:none;
    padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;
    min-height:var(--touch-target-min);display:inline-flex;align-items:center;gap:6px}
  header .hbtn:hover{background:var(--panel-3)}
  header .hbtn.primary{background:var(--accent);color:#0f172a;font-weight:600}
  header .hbtn.primary:hover{background:var(--accent-hover)}

  main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:18px 16px 60px}

  /* ── Home: book hero ────────────────────────────────────────────────── */
  .hero{background:linear-gradient(135deg,#132036,#0f172a);
    border:1px solid var(--panel-2);border-radius:var(--radius-lg);
    padding:20px;margin-bottom:20px}
  .hero .book-title{font-size:20px;font-weight:700;color:var(--text-strong);margin:0}
  .hero .book-sub{color:var(--muted);font-size:14px;margin:4px 0 0}
  .hero .book-author{color:var(--accent);font-size:13px;margin:8px 0 0;font-weight:500}
  .hero .book-desc{color:var(--text);font-size:14px;margin:14px 0 0;line-height:1.55}
  .hero .overall{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
  .ring{--pct:0;width:64px;height:64px;border-radius:50%;flex:none;
    background:conic-gradient(var(--good) calc(var(--pct)*1%),var(--panel-2) 0);
    display:grid;place-items:center}
  .ring::before{content:'';width:48px;height:48px;border-radius:50%;background:var(--bg)}
  .ring span{position:absolute;font-size:13px;font-weight:700;color:var(--text-strong)}
  .ring-wrap{position:relative;display:grid;place-items:center}
  .overall .stat-copy{font-size:13px;color:var(--muted)}
  .overall .stat-copy b{color:var(--text-strong)}
  .cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .cta{border:none;border-radius:8px;padding:12px 16px;font-size:14px;font-weight:600;
    cursor:pointer;min-height:var(--touch-target-min);display:inline-flex;align-items:center;gap:8px}
  .cta.primary{background:var(--accent);color:#0f172a}
  .cta.primary:hover{background:var(--accent-hover)}
  .cta.ghost{background:var(--panel-2);color:var(--text)}
  .cta.ghost:hover{background:var(--panel-3)}
  .cta:disabled{opacity:.45;cursor:not-allowed}
  .due-pill{display:inline-flex;align-items:center;justify-content:center;
    background:var(--warn);color:#0f172a;font-size:11px;font-weight:700;
    border-radius:999px;padding:1px 7px;margin-left:2px;min-width:18px}

  /* ── Home: chapter list ─────────────────────────────────────────────── */
  .part-head{font-size:12px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);margin:22px 4px 10px;font-weight:600}
  .ch-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--panel-2);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
  .ch-card:hover{border-color:var(--accent);background:#1b2536}
  .ch-num{flex:none;width:38px;height:38px;border-radius:9px;background:var(--panel-2);
    color:var(--accent);font-weight:700;font-size:16px;display:grid;place-items:center}
  .ch-num.done{background:var(--good-soft);color:var(--good-soft-fg)}
  .ch-main{flex:1;min-width:0}
  .ch-title{font-size:15px;font-weight:600;color:var(--text-strong);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
  .bar{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;min-width:60px}
  .bar > i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
  .ch-frac{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ch-due{font-size:11px;font-weight:700;color:var(--warn);white-space:nowrap}
  .ch-chevron{color:var(--dim);font-size:18px}

  /* ── Drill session ──────────────────────────────────────────────────── */
  #progress-wrap{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:6px}
  #progress-bar{height:100%;background:var(--accent);width:0;transition:width .25s}
  .sess-meta{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:16px}
  .sess-meta .streak{color:var(--warn);font-weight:600}
  .q-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 8px;border-radius:4px;background:var(--panel-2);color:var(--muted);margin-bottom:12px}
  .q-stem{font-size:18px;line-height:1.5;color:var(--text-strong);margin:0 0 20px;white-space:pre-wrap}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;background:var(--panel);
    border:2px solid var(--panel-2);border-radius:10px;cursor:pointer;transition:all .12s;
    text-align:left;color:var(--text);font-size:15px;line-height:1.45;width:100%}
  .opt:hover:not(:disabled){border-color:var(--panel-3);background:#1b2536}
  .opt:disabled{cursor:default}
  .opt-letter{flex:none;width:26px;height:26px;border-radius:6px;background:var(--panel-2);
    color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
  .opt-body{flex:1;padding-top:2px}
  .opt.correct{border-color:var(--good);background:rgba(34,197,94,.12)}
  .opt.correct .opt-letter{background:var(--good);color:#0f172a}
  .opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}
  .opt.wrong .opt-letter{background:var(--bad);color:#0f172a}
  .opt.muted{opacity:.55}
  .explain{margin-top:16px;padding:14px 15px;border-radius:10px;border-left:3px solid var(--accent);
    background:var(--panel);font-size:14px;line-height:1.55;color:var(--text)}
  .explain.correct{border-left-color:var(--good)}
  .explain.wrong{border-left-color:var(--bad)}
  .explain .verdict{font-weight:700;margin-right:6px}
  .explain .verdict.correct{color:var(--good)}
  .explain .verdict.wrong{color:var(--bad)}

  .action-bar{position:sticky;bottom:0;margin-top:20px;padding:14px 0 4px;
    background:linear-gradient(to top,var(--bg) 70%,transparent);
    display:flex;gap:10px;justify-content:flex-end}
  .action-bar .cta{flex:1}
  @media(min-width:600px){.action-bar .cta{flex:none;min-width:150px}}

  /* ── Session summary ────────────────────────────────────────────────── */
  .summary{background:var(--panel);border:1px solid var(--panel-2);border-radius:var(--radius-lg);
    padding:24px;text-align:center}
  .summary h2{margin:0 0 6px;font-size:22px;color:var(--text-strong)}
  .summary .score{font-size:44px;font-weight:800;color:var(--accent);margin:10px 0}
  .summary .sub{color:var(--muted);font-size:14px}
  .summary .gained{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;
    background:var(--good-soft);color:var(--good-soft-fg);font-size:13px;font-weight:600}

  /* ── Stats modal ────────────────────────────────────────────────────── */
  .modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;
    display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
  .modal-scrim.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--panel-2);border-radius:var(--radius-lg);
    max-width:560px;width:100%;padding:22px}
  .modal h2{margin:0 0 4px;font-size:18px;color:var(--text-strong)}
  .modal .close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .stat-tile{background:var(--panel-2);border-radius:8px;padding:12px;text-align:center}
  .stat-tile .n{font-size:24px;font-weight:800;color:var(--text-strong);font-variant-numeric:tabular-nums}
  .stat-tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .part-stat{margin:14px 0}
  .part-stat .ph{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .part-stat .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
  .part-stat .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .danger-link{display:block;text-align:center;margin-top:18px;color:var(--dim);font-size:12px;cursor:pointer;background:none;border:none;width:100%}
  .danger-link:hover{color:var(--bad)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .loading{text-align:center;color:var(--muted);padding:60px 20px}
  .kbd-hint{text-align:center;color:var(--dim);font-size:12px;margin-top:14px}
  @media(max-width:480px){ .kbd-hint{display:none} .q-stem{font-size:17px} }
</style>
</head>
<body>

<header>
  <button class="home-link hbtn" id="home-btn" style="background:none;padding:6px 4px" title="All chapters">
    <span class="badge">🗄️</span>
    <h1>System Design Drill</h1>
  </button>
  <span class="spacer"></span>
  <button class="hbtn" id="stats-btn" title="Your stats">📊 <span class="lbl">Stats</span></button>
  <a class="hbtn" href="index.html" title="Back to JS drill">JS&nbsp;Drill&nbsp;↗</a>
</header>

<main id="app"><div class="loading">Loading…</div></main>

<div class="modal-scrim" id="stats-modal">
  <div class="modal" id="stats-body"></div>
</div>

<script>
// ============================================================================
// System Design memorization drill — standalone MC surface.
// Content: data/system-design/<topic>/manifest.json + chNN.json.
// Progress: DrillStorage.load/saveSystemDesign (key jsdrill.systemdesign.v1).
// ============================================================================
'use strict';

const TOPIC = 'ddia';
const BASE = `data/system-design/${TOPIC}`;

// Leitner-style spaced boxes. box 0 = unseen. Mastered at MASTER_BOX.
const INTERVAL_DAYS = [0, 1, 3, 7, 16, 45];   // days until due after reaching box i
const MAX_BOX = 5;
const MASTER_BOX = 4;
const DAY = 86400000;

// ── State ───────────────────────────────────────────────────────────────
let META = null;              // manifest
let CH_CACHE = {};            // chapterId -> chapter json
let progress = load();        // { __v, boxes:{key:{box,seen,correct,wrong,due,last}}, lastChapter }
let session = null;           // active drill session

function load() {
  const s = (window.DrillStorage && DrillStorage.loadSystemDesign()) || null;
  if (s && s.boxes) return s;
  return { __v: 1, boxes: {}, lastChapter: null };
}
function persist() {
  if (window.DrillStorage) DrillStorage.saveSystemDesign(progress);
}
function keyOf(chId, qIdx) { return `${TOPIC}/${chId}/${qIdx}`; }
function boxFor(chId, qIdx) { return progress.boxes[keyOf(chId, qIdx)] || { box: 0, seen: 0, correct: 0, wrong: 0, due: 0, last: 0 }; }
function isMastered(chId, qIdx) { return boxFor(chId, qIdx).box >= MASTER_BOX; }
function isDue(chId, qIdx) { const b = boxFor(chId, qIdx); return b.box === 0 || b.due <= Date.now(); }

function grade(chId, qIdx, correct) {
  const k = keyOf(chId, qIdx);
  const b = progress.boxes[k] || { box: 0, seen: 0, correct: 0, wrong: 0, due: 0, last: 0 };
  b.seen++;
  b.last = Date.now();
  if (correct) { b.correct++; b.box = Math.min(b.box + 1, MAX_BOX); }
  else { b.wrong++; b.box = 1; }   // wrong drops back into active rotation, not all the way to unseen
  b.due = Date.now() + INTERVAL_DAYS[Math.min(b.box, INTERVAL_DAYS.length - 1)] * DAY;
  progress.boxes[k] = b;
  persist();
}

// ── Data loading ──────────────────────────────────────────────────────────
async function loadMeta() {
  if (META) return META;
  META = await fetch(`${BASE}/manifest.json`).then(r => r.json());
  return META;
}
async function loadChapter(id) {
  if (CH_CACHE[id]) return CH_CACHE[id];
  const ch = await fetch(`${BASE}/${id}.json`).then(r => r.json());
  CH_CACHE[id] = ch;
  return ch;
}
async function loadAllChapters() {
  await Promise.all(META.chapters.map(c => loadChapter(c.id)));
  return META.chapters.map(c => CH_CACHE[c.id]);
}

// ── Helpers ─────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
// Render `code` spans from markdown-lite backticks after escaping HTML.
function fmt(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[r[i], r[j]] = [r[j], r[i]]; } return r; }
function chapterQStats(ch) {
  let mastered = 0, due = 0;
  ch.questions.forEach((_, i) => { if (isMastered(ch.id, i)) mastered++; if (isDue(ch.id, i)) due++; });
  return { total: ch.questions.length, mastered, due };
}

// ============================================================================
// HOME
// ============================================================================
async function renderHome() {
  session = null;
  const app = document.getElementById('app');
  await loadMeta();
  const chapters = await loadAllChapters();

  let totalQ = 0, totalMastered = 0, totalDue = 0;
  chapters.forEach(ch => { const s = chapterQStats(ch); totalQ += s.total; totalMastered += s.mastered; totalDue += s.due; });
  const pct = totalQ ? Math.round(totalMastered / totalQ * 100) : 0;

  const byId = Object.fromEntries(chapters.map(c => [c.id, c]));
  const resumeCh = progress.lastChapter && byId[progress.lastChapter];

  let html = `
    <section class="hero">
      <p class="book-title">${esc(META.title)}</p>
      <p class="book-sub">${esc(META.subtitle || '')}</p>
      <p class="book-author">${esc(META.author || '')}</p>
      <p class="book-desc">${esc(META.description || '')}</p>
      <div class="overall">
        <div class="ring-wrap"><div class="ring" style="--pct:${pct}"></div><span>${pct}%</span></div>
        <div class="stat-copy">
          <b>${totalMastered}</b> of <b>${totalQ}</b> concepts mastered<br>
          <b>${totalDue}</b> question${totalDue === 1 ? '' : 's'} due for review
        </div>
      </div>
      <div class="cta-row">
        <button class="cta primary" id="mixed-btn" ${totalQ ? '' : 'disabled'}>⚡ Mixed review${totalDue ? ` <span class="due-pill">${totalDue}</span>` : ''}</button>
        ${resumeCh ? `<button class="cta ghost" id="resume-btn">↻ Resume ${esc('Ch ' + resumeCh.chapter)}</button>` : ''}
      </div>
    </section>`;

  for (const part of META.parts) {
    html += `<div class="part-head">${esc(part.name)}</div>`;
    for (const cid of part.chapters) {
      const ch = byId[cid];
      if (!ch) continue;
      const s = chapterQStats(ch);
      const p = s.total ? Math.round(s.mastered / s.total * 100) : 0;
      const done = s.total && s.mastered === s.total;
      html += `
        <button class="ch-card" data-ch="${ch.id}">
          <div class="ch-num ${done ? 'done' : ''}">${done ? '✓' : ch.chapter}</div>
          <div class="ch-main">
            <div class="ch-title">${esc(ch.title)}</div>
            <div class="ch-meta">
              <span class="bar"><i style="width:${p}%"></i></span>
              <span class="ch-frac">${s.mastered}/${s.total}</span>
              ${s.due ? `<span class="ch-due">${s.due} due</span>` : ''}
            </div>
          </div>
          <span class="ch-chevron">›</span>
        </button>`;
    }
  }

  app.innerHTML = html;
  app.querySelectorAll('.ch-card').forEach(el =>
    el.addEventListener('click', () => startChapter(el.dataset.ch)));
  const mb = document.getElementById('mixed-btn');
  if (mb) mb.addEventListener('click', startMixed);
  const rb = document.getElementById('resume-btn');
  if (rb) rb.addEventListener('click', () => startChapter(progress.lastChapter));
  window.scrollTo(0, 0);
}

// ============================================================================
// SESSION SETUP
// ============================================================================
async function startChapter(chId) {
  const ch = await loadChapter(chId);
  progress.lastChapter = chId;
  persist();
  // Order: due/unseen questions first (shuffled), then the rest, so a review
  // session front-loads what needs work but still covers the whole chapter.
  const idx = ch.questions.map((_, i) => i);
  const due = shuffle(idx.filter(i => isDue(chId, i)));
  const rest = shuffle(idx.filter(i => !isDue(chId, i)));
  const order = due.concat(rest).map(i => ({ chId, qIdx: i }));
  session = { title: ch.title, subtitle: `Chapter ${ch.chapter}`, items: order, pos: 0, right: 0, gained: 0, streak: 0, answered: false };
  renderQuestion();
}

async function startMixed() {
  await loadAllChapters();
  let pool = [];
  META.chapters.forEach(c => {
    const ch = CH_CACHE[c.id];
    ch.questions.forEach((_, i) => { if (isDue(c.id, i)) pool.push({ chId: c.id, qIdx: i, ch }); });
  });
  // If little is due, top up with the least-known (lowest box) so a mixed
  // session is never empty and always interleaves across chapters.
  if (pool.length < 12) {
    const extra = [];
    META.chapters.forEach(c => {
      const ch = CH_CACHE[c.id];
      ch.questions.forEach((_, i) => { if (!isDue(c.id, i)) extra.push({ chId: c.id, qIdx: i, ch, box: boxFor(c.id, i).box }); });
    });
    extra.sort((a, b) => a.box - b.box);
    pool = pool.concat(extra.slice(0, 12 - pool.length));
  }
  const items = shuffle(pool).slice(0, 20).map(x => ({ chId: x.chId, qIdx: x.qIdx }));
  session = { title: 'Mixed Review', subtitle: 'Interleaved across the book', items, pos: 0, right: 0, gained: 0, streak: 0, answered: false, mixed: true };
  renderQuestion();
}

// ============================================================================
// QUESTION RENDER
// ============================================================================
function renderQuestion() {
  const app = document.getElementById('app');
  if (session.pos >= session.items.length) return renderSummary();
  const { chId, qIdx } = session.items[session.pos];
  const ch = CH_CACHE[chId];
  const q = ch.questions[qIdx];
  const total = session.items.length;
  const pct = Math.round(session.pos / total * 100);
  const wasMastered = isMastered(chId, qIdx);
  session._wasMastered = wasMastered;

  const tag = session.mixed ? `Ch ${ch.chapter} · ${esc(ch.title)}` : `Question ${session.pos + 1} of ${total}`;

  app.innerHTML = `
    <div id="progress-wrap"><div id="progress-bar" style="width:${pct}%"></div></div>
    <div class="sess-meta">
      <span>${esc(session.title)} — ${session.pos + 1}/${total}</span>
      <span>${session.streak >= 3 ? `<span class="streak">🔥 ${session.streak} streak</span>` : `${session.right} correct`}</span>
    </div>
    <span class="q-tag">${tag}</span>
    <p class="q-stem">${fmt(q.q)}</p>
    <div class="options" id="opts">
      ${q.options.map((o, i) => `
        <button class="opt" data-i="${i}">
          <span class="opt-letter">${'ABCD'[i]}</span>
          <span class="opt-body">${fmt(o)}</span>
        </button>`).join('')}
    </div>
    <div id="explain-slot"></div>
    <div class="action-bar" id="action-bar"></div>
    <p class="kbd-hint">Tap an answer &nbsp;·&nbsp; keys <code>A–D</code> or <code>1–4</code> to answer, <code>Enter</code> for next</p>`;

  session.answered = false;
  app.querySelectorAll('.opt').forEach(el =>
    el.addEventListener('click', () => selectAnswer(parseInt(el.dataset.i, 10))));
  window.scrollTo(0, 0);
}

function selectAnswer(choice) {
  if (session.answered) return;
  session.answered = true;
  const { chId, qIdx } = session.items[session.pos];
  const q = CH_CACHE[chId].questions[qIdx];
  const correct = choice === q.answer;

  grade(chId, qIdx, correct);
  if (correct) {
    session.right++; session.streak++;
    if (!session._wasMastered && isMastered(chId, qIdx)) session.gained++;
  } else {
    session.streak = 0;
  }

  document.querySelectorAll('.opt').forEach((el, i) => {
    el.disabled = true;
    if (i === q.answer) el.classList.add('correct');
    else if (i === choice) el.classList.add('wrong');
    else el.classList.add('muted');
  });

  const slot = document.getElementById('explain-slot');
  slot.innerHTML = `
    <div class="explain ${correct ? 'correct' : 'wrong'}">
      <span class="verdict ${correct ? 'correct' : 'wrong'}">${correct ? '✓ Correct.' : '✗ Not quite.'}</span>
      ${fmt(q.explain)}
    </div>`;

  const last = session.pos === session.items.length - 1;
  document.getElementById('action-bar').innerHTML =
    `<button class="cta primary" id="next-btn">${last ? 'Finish →' : 'Next →'}</button>`;
  document.getElementById('next-btn').addEventListener('click', nextQuestion);
}

function nextQuestion() {
  session.pos++;
  renderQuestion();
}

// ============================================================================
// SUMMARY
// ============================================================================
function renderSummary() {
  const app = document.getElementById('app');
  const total = session.items.length;
  const pct = total ? Math.round(session.right / total * 100) : 0;
  app.innerHTML = `
    <div class="summary">
      <h2>Session complete</h2>
      <div class="score">${session.right}/${total}</div>
      <p class="sub">${pct}% correct on this ${session.mixed ? 'mixed review' : 'chapter'}.</p>
      ${session.gained ? `<div class="gained">🎯 ${session.gained} new concept${session.gained === 1 ? '' : 's'} mastered</div>` : ''}
      <div class="cta-row" style="justify-content:center;margin-top:22px">
        ${session.mixed ? `<button class="cta primary" id="again-btn">⚡ Another mixed set</button>` : `<button class="cta primary" id="again-btn">↻ Drill again</button>`}
        <button class="cta ghost" id="back-btn">← All chapters</button>
      </div>
    </div>`;
  document.getElementById('back-btn').addEventListener('click', renderHome);
  document.getElementById('again-btn').addEventListener('click', session.mixed ? startMixed : () => startChapter(session.items.length ? session.items[0].chId : progress.lastChapter));
  window.scrollTo(0, 0);
}

// ============================================================================
// STATS MODAL
// ============================================================================
async function openStats() {
  await loadMeta();
  await loadAllChapters();
  const byId = Object.fromEntries(META.chapters.map(c => [c.id, CH_CACHE[c.id]]));
  let totalQ = 0, totalM = 0, totalDue = 0, seenQ = 0;
  META.chapters.forEach(c => {
    const ch = byId[c.id];
    ch.questions.forEach((_, i) => {
      totalQ++;
      const b = boxFor(c.id, i);
      if (b.seen > 0) seenQ++;
      if (b.box >= MASTER_BOX) totalM++;
      if (isDue(c.id, i)) totalDue++;
    });
  });

  let parts = '';
  for (const part of META.parts) {
    let pm = 0, pt = 0;
    const rows = part.chapters.map(cid => {
      const ch = byId[cid]; if (!ch) return '';
      const s = chapterQStats(ch); pm += s.mastered; pt += s.total;
      const p = s.total ? Math.round(s.mastered / s.total * 100) : 0;
      return `<div class="row"><span class="nm">Ch ${ch.chapter}. ${esc(ch.title)}</span>
        <span class="bar" style="max-width:90px"><i style="width:${p}%"></i></span>
        <span class="ch-frac">${s.mastered}/${s.total}</span></div>`;
    }).join('');
    parts += `<div class="part-stat"><div class="ph">${esc(part.name)} — ${pm}/${pt}</div>${rows}</div>`;
  }

  document.getElementById('stats-body').innerHTML = `
    <button class="close" id="stats-close">×</button>
    <h2>Your progress</h2>
    <p style="color:var(--muted);font-size:13px;margin:2px 0 0">${esc(META.title)}</p>
    <div class="stat-grid">
      <div class="stat-tile"><div class="n">${totalM}</div><div class="l">Mastered</div></div>
      <div class="stat-tile"><div class="n">${seenQ}</div><div class="l">Seen</div></div>
      <div class="stat-tile"><div class="n">${totalDue}</div><div class="l">Due</div></div>
    </div>
    ${parts}
    <button class="danger-link" id="reset-btn">Reset all system-design progress</button>`;

  document.getElementById('stats-modal').classList.add('open');
  document.getElementById('stats-close').addEventListener('click', closeStats);
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (confirm('Reset ALL system-design memorization progress? This cannot be undone.')) {
      progress = { __v: 1, boxes: {}, lastChapter: null };
      persist();
      closeStats();
      renderHome();
    }
  });
}
function closeStats() { document.getElementById('stats-modal').classList.remove('open'); }

// ============================================================================
// KEYBOARD + BOOT
// ============================================================================
document.addEventListener('keydown', e => {
  if (document.getElementById('stats-modal').classList.contains('open')) {
    if (e.key === 'Escape') closeStats();
    return;
  }
  if (!session) return;
  if (!session.answered) {
    let pick = -1;
    if (/^[a-dA-D]$/.test(e.key)) pick = 'abcd'.indexOf(e.key.toLowerCase());
    else if (/^[1-4]$/.test(e.key)) pick = parseInt(e.key, 10) - 1;
    if (pick >= 0) { e.preventDefault(); selectAnswer(pick); }
  } else if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
    e.preventDefault(); nextQuestion();
  }
});

document.getElementById('home-btn').addEventListener('click', renderHome);
document.getElementById('stats-btn').addEventListener('click', openStats);
document.getElementById('stats-modal').addEventListener('click', e => {
  if (e.target.id === 'stats-modal') closeStats();
});

renderHome().catch(err => {
  document.getElementById('app').innerHTML =
    `<div class="empty">Couldn't load content.<br><small>${esc(err.message)}</small><br><br>
     Serve this over http (e.g. <code>python3 -m http.server</code>) — <code>file://</code> can't fetch the JSON.</div>`;
  console.error(err);
});
</script>
