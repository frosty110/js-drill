<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design — Memorization Drill</title>
<meta name="description" content="Multiple-choice + explain-and-apply recall drills for system design: DDIA, the interview framework, and the building blocks.">
<!-- One design system across the family (design-loop P8): ds tokens + components
     (the legacy --bg/--panel/--accent names resolve as aliases inside ds/tokens.css). -->
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<script src="ds/icons.js"></script>
<script src="js/storage.js"></script>
<!-- Optional cross-device sync (Supabase). Skipped at runtime if config missing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/sync.js" defer></script>
<!-- Diagrams-as-code. Loaded from CDN; the app degrades gracefully (shows the
     diagram source) if it's unavailable, so nothing else depends on it. -->
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root { --bg: var(--bg-elevated); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:15px/1.5 var(--font-sans);-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent-link);text-decoration:none}
  a:hover{text-decoration:underline}
  code{background:var(--ds-code-bg);padding:1px 5px;border-radius:3px;
    font:.85em var(--font-mono);color:var(--ds-accent-hi)}

  /* ── Header ─────────────────────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:12px 16px;border-bottom:1px solid var(--panel-2);
    display:flex;align-items:center;gap:12px}
  header .home-link{display:flex;align-items:center;gap:9px;min-width:0;
    background:none;border:none;color:var(--text-strong);cursor:pointer;font:inherit;padding:6px 4px}
  header .badge{font-size:20px;line-height:1}
  header h1{margin:0;font-size:15px;font-weight:600;color:var(--text-strong);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .spacer{flex:1}
  header .hbtn{background:var(--panel-2);color:var(--text);border:none;
    padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;
    min-height:var(--touch-target-min);display:inline-flex;align-items:center;gap:6px}
  header .hbtn:hover{background:var(--panel-3);text-decoration:none}

  main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:18px 16px 60px}
  .crumb{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
    padding:4px 0;margin-bottom:8px;display:inline-flex;align-items:center;gap:6px}
  .crumb:hover{color:var(--accent)}

  /* ── Topic landing ──────────────────────────────────────────────────── */
  .lead{margin:4px 0 18px}
  .lead h2{margin:0;font-size:20px;color:var(--text-strong)}
  .lead p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .topic-card{display:flex;gap:16px;width:100%;text-align:left;align-items:flex-start;
    background:var(--panel);border:1px solid var(--panel-2);border-radius:var(--radius-lg);
    padding:18px;margin-bottom:14px;cursor:pointer;transition:border-color .15s,background .15s}
  .topic-card:hover{border-color:var(--accent);background:var(--ds-surface-2)}
  .topic-icon{font-size:30px;line-height:1;flex:none;margin-top:2px}
  .topic-body{flex:1;min-width:0}
  .topic-title{font-size:17px;font-weight:700;color:var(--text-strong)}
  .topic-kind{font-size:12px;color:var(--accent);margin-top:2px;font-weight:500}
  .topic-blurb{font-size:13.5px;color:var(--text);margin-top:8px;line-height:1.5}
  .topic-prog{display:flex;align-items:center;gap:8px;margin-top:12px}
  .topic-prog .ch-frac{font-size:12px;color:var(--muted)}

  /* ── Book/topic hero ────────────────────────────────────────────────── */
  .hero{background:linear-gradient(135deg,var(--ds-surface-2),var(--ds-surface));
    border:1px solid var(--panel-2);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px}
  .hero .book-title{font-size:20px;font-weight:700;color:var(--text-strong);margin:0}
  .hero .book-sub{color:var(--muted);font-size:14px;margin:4px 0 0}
  .hero .book-author{color:var(--accent);font-size:13px;margin:8px 0 0;font-weight:500}
  .hero .book-desc{color:var(--text);font-size:14px;margin:14px 0 0;line-height:1.55}
  .hero .overall{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
  .ring{--pct:0;width:64px;height:64px;border-radius:50%;flex:none;
    background:conic-gradient(var(--good) calc(var(--pct)*1%),var(--panel-2) 0);display:grid;place-items:center}
  .ring::before{content:'';width:48px;height:48px;border-radius:50%;background:var(--bg)}
  .ring span{position:absolute;font-size:13px;font-weight:700;color:var(--text-strong)}
  .ring-wrap{position:relative;display:grid;place-items:center}
  .overall .stat-copy{font-size:13px;color:var(--muted)}
  .overall .stat-copy b{color:var(--text-strong)}
  .cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .due-pill{display:inline-flex;align-items:center;justify-content:center;background:var(--warn);color:var(--ds-surface);
    font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:2px;min-width:18px}

  /* ── Chapter list ───────────────────────────────────────────────────── */
  .part-head{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:22px 4px 10px;font-weight:600}
  .ch-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--panel-2);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:border-color .15s,background .15s}
  .ch-card:hover{border-color:var(--accent);background:var(--ds-surface-2)}
  .ch-num{flex:none;width:38px;height:38px;border-radius:9px;background:var(--panel-2);color:var(--accent);
    font-weight:700;font-size:14px;display:grid;place-items:center}
  .ch-num.done{background:var(--good-soft);color:var(--good-soft-fg)}
  .ch-main{flex:1;min-width:0}
  .ch-title{font-size:15px;font-weight:600;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
  .bar{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;min-width:60px}
  .bar > i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
  .ch-frac{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ch-due{font-size:11px;font-weight:700;color:var(--warn);white-space:nowrap}
  .ch-chevron{color:var(--dim);font-size:18px}

  /* ── Unit detail (key ideas + drill-mode picker) ────────────────────── */
  .detail{background:var(--panel);border:1px solid var(--panel-2);border-radius:var(--radius-lg);padding:22px}
  .detail-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);
    background:var(--panel-2);padding:3px 9px;border-radius:4px;font-weight:600}
  .detail-title{margin:12px 0 6px;font-size:22px;color:var(--text-strong);line-height:1.25}
  .detail-summary{margin:0;color:var(--text);font-size:15px;line-height:1.55}
  .detail-prog{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:12px;color:var(--muted)}
  .key-ideas{margin:18px 0 4px;background:var(--ds-surface-2);border:1px solid var(--panel-2);border-left:3px solid var(--accent);
    border-radius:10px;padding:16px 18px}
  .key-ideas h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .key-ideas ul{margin:0;padding-left:20px}
  .key-ideas li{margin:8px 0;font-size:14.5px;line-height:1.55;color:var(--text)}

  /* ── Diagrams (Mermaid / inline SVG) ────────────────────────────────── */
  .diagram-slot{margin:16px 0 4px}
  .diagram-cap{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
  .diagram-box{overflow-x:auto;background:var(--ds-code-bg);border:1px solid var(--panel-2);border-radius:10px;padding:14px;text-align:center}
  .diagram-box svg{max-width:100%;height:auto}
  .diagram-src{overflow-x:auto;background:var(--ds-code-bg);border:1px solid var(--panel-2);border-radius:10px;padding:12px;
    font:12px/1.5 var(--font-mono);color:var(--muted);white-space:pre;margin:0;text-align:left}
  .diagram-deck{margin:18px 0 6px;border:1px solid var(--panel-2);border-radius:12px;
    background:var(--ds-surface-2);padding:14px}
  .diagram-deck__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .diagram-deck__eyebrow{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--accent);font-weight:700;margin-bottom:2px}
  .diagram-deck__title{display:block;color:var(--text-strong);font-size:15px;line-height:1.35}
  .diagram-deck__count{flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;
    background:var(--panel-2);border-radius:999px;padding:3px 8px}
  .diagram-deck__takeaway{margin:10px 2px 2px;color:var(--text);font-size:13px;line-height:1.5}
  .diagram-deck__controls{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:12px}
  .diagram-deck__controls .ds-btn{min-height:var(--touch-target-min);padding:8px 10px}
  .diagram-deck__controls .diagram-recall{white-space:nowrap}
  .diagram-deck.is-recall .diagram-box svg text,
  .diagram-deck.is-recall .diagram-box svg foreignObject{opacity:0}
  .diagram-deck.is-recall .diagram-src{filter:blur(5px);user-select:none}
  .diagram-deck.is-recall .diagram-box{outline:1px dashed var(--accent);outline-offset:-5px}
  @media(max-width:480px){
    .detail{padding:18px 14px}
    .diagram-deck{margin-left:-4px;margin-right:-4px;padding:12px 10px}
    .diagram-box{padding:10px;min-height:170px;display:grid;place-items:center}
    .diagram-deck__controls{grid-template-columns:44px minmax(0,1fr) 44px}
  }

  /* ── Drill session ──────────────────────────────────────────────────── */
  #progress-wrap{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:6px}
  #progress-bar{height:100%;background:var(--accent);width:0;transition:width .25s}
  .sess-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:16px}
  .sess-meta .streak{color:var(--warn);font-weight:600}
  .q-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;
    border-radius:4px;background:var(--panel-2);color:var(--muted);margin-bottom:12px}
  .q-tag.open{background:var(--ds-accent-soft);color:var(--ds-accent-hi)}
  .q-stem{font-size:18px;line-height:1.5;color:var(--text-strong);margin:0 0 20px;white-space:pre-wrap}
  .explain{margin-top:16px;padding:14px 15px;border-radius:10px;border-left:3px solid var(--accent);
    background:var(--panel);font-size:14px;line-height:1.55;color:var(--text)}
  .explain.correct{border-left-color:var(--good)}
  .explain.wrong{border-left-color:var(--bad)}
  .explain .verdict{font-weight:700;margin-right:6px}
  .explain .verdict.correct{color:var(--good)}
  .explain .verdict.wrong{color:var(--bad)}

  /* ── Open (explain & apply) ─────────────────────────────────────────── */
  .open-hint{font-size:13px;color:var(--muted);margin:0 0 14px}
  .open-hint b{color:var(--accent)}
  .open-scratch{width:100%;min-height:96px;background:var(--panel);color:var(--text);
    border:1px solid var(--panel-2);border-radius:10px;padding:12px;font:14px/1.5 inherit;resize:vertical;margin-bottom:14px}
  .open-scratch:focus{outline:none;border-color:var(--accent)}
  .model{margin-top:4px;padding:16px;border-radius:10px;background:var(--panel);border:1px solid var(--panel-2)}
  .model h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .model ul{margin:0 0 14px;padding-left:20px}
  .model li{margin:5px 0;font-size:14px;line-height:1.5}
  .model .ans{font-size:14px;line-height:1.6;color:var(--text);border-top:1px dashed var(--panel-2);padding-top:12px}
  .grade-row{display:flex;gap:10px;margin-top:16px}
  .grade-row .cta{flex:1}
  .cta.again{background:var(--bad-soft);color:var(--bad-soft-fg)}
  .cta.again:hover{background:var(--bad-soft)}
  .cta.partial{background:var(--warn-soft);color:var(--warn-soft-fg)}
  .cta.partial:hover{background:var(--warn-soft)}
  .cta.good{background:var(--good-soft);color:var(--good-soft-fg)}
  .cta.good:hover{background:var(--good-soft)}

  .action-bar{position:sticky;bottom:0;margin-top:20px;padding:14px 0 4px;
    background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;justify-content:flex-end}
  .action-bar .cta{flex:1}
  @media(min-width:600px){.action-bar .cta{flex:none;min-width:150px}}

  /* ── Summary ────────────────────────────────────────────────────────── */
  .summary{background:var(--panel);border:1px solid var(--panel-2);border-radius:var(--radius-lg);padding:24px;text-align:center}
  .summary h2{margin:0 0 6px;font-size:22px;color:var(--text-strong)}
  .summary .score{font-size:44px;font-weight:800;color:var(--accent);margin:10px 0}
  .summary .sub{color:var(--muted);font-size:14px}
  .summary .gained{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;
    background:var(--good-soft);color:var(--good-soft-fg);font-size:13px;font-weight:600}

  /* ── Stats modal ────────────────────────────────────────────────────── */
  .ds-sheet h2{margin:0 0 4px;font-size:18px;color:var(--text-strong)}
  .close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .stat-tile{background:var(--panel-2);border-radius:8px;padding:12px;text-align:center}
  .stat-tile .n{font-size:24px;font-weight:800;color:var(--text-strong);font-variant-numeric:tabular-nums}
  .stat-tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .part-stat{margin:14px 0}
  .part-stat .ph{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .part-stat .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
  .part-stat .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .danger-link{display:block;text-align:center;margin-top:18px;color:var(--dim);font-size:12px;cursor:pointer;background:none;border:none;width:100%}
  .danger-link:hover{color:var(--bad)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .loading{text-align:center;color:var(--muted);padding:60px 20px}
  .kbd-hint{text-align:center;color:var(--dim);font-size:12px;margin-top:14px}
  @media(max-width:480px){ .kbd-hint{display:none} .q-stem{font-size:17px} }
</style>
</head>
<body>

<header>
  <button class="home-link" id="home-btn" title="All topics">
    <span class="badge">🗄️</span>
    <h1>System Design Drill</h1>
  </button>
  <span class="spacer"></span>
  <button class="hbtn" id="stats-btn" title="Your stats" hidden>📊 <span class="lbl">Stats</span></button>
  <a class="hbtn" href="index.html" title="Back to JS drill">JS&nbsp;Drill&nbsp;↗</a>
</header>

<main id="app"><div class="loading">Loading…</div></main>

<div class="ds-root ds-scrim" id="stats-modal"><div class="ds-sheet ds-sheet--scroll" id="stats-body"></div></div>

<script>
// ============================================================================
// System Design memorization drill — standalone, multi-topic MC + open recall.
// Content: data/system-design/topics.json → <topic>/manifest.json → chNN.json.
// Progress: DrillStorage.load/saveSystemDesign (key jsdrill.systemdesign.v1).
// ============================================================================
'use strict';

const BASE = 'data/system-design';
const INTERVAL_DAYS = [0, 1, 3, 7, 16, 45];  // days until due after reaching box i
const MAX_BOX = 5, MASTER_BOX = 4, DAY = 86400000;

let TOPICS = [];              // topics.json registry
let META = {};               // topicId -> manifest
let CH = {};                 // topicId -> { chId -> chapter json }
let progress = load();       // { __v, boxes:{key:{box,seen,good,again,due,last}}, lastTopic, lastChapter }
let session = null;
let curTopic = null;

function load() {
  const s = (window.DrillStorage && DrillStorage.loadSystemDesign()) || null;
  if (s && s.boxes) return s;
  return { __v: 1, boxes: {}, lastTopic: null, lastChapter: null };
}
function persist() { if (window.DrillStorage) DrillStorage.saveSystemDesign(progress); }

// ── SR (Leitner) keyed by full item key ─────────────────────────────────
function boxOf(key) { return progress.boxes[key] || { box: 0, seen: 0, good: 0, again: 0, due: 0, last: 0 }; }
function isMastered(key) { return boxOf(key).box >= MASTER_BOX; }
function isDue(key) { const b = boxOf(key); return b.box === 0 || b.due <= Date.now(); }
function grade(key, outcome) {   // 'good' | 'partial' | 'again'
  const b = progress.boxes[key] || { box: 0, seen: 0, good: 0, again: 0, due: 0, last: 0 };
  b.seen++; b.last = Date.now();
  if (outcome === 'good') { b.good++; b.box = Math.min(b.box + 1, MAX_BOX); }
  else if (outcome === 'partial') { b.box = Math.max(b.box, 1); }   // hold position, resurface soon
  else { b.again++; b.box = 1; }
  const interval = outcome === 'partial' ? 1 : INTERVAL_DAYS[Math.min(b.box, INTERVAL_DAYS.length - 1)];
  b.due = Date.now() + interval * DAY;
  progress.boxes[key] = b; persist();
}

// ── Data loading ─────────────────────────────────────────────────────────
async function loadTopics() { if (!TOPICS.length) TOPICS = (await fetch(`${BASE}/topics.json`).then(r => r.json())).topics; return TOPICS; }
async function loadMeta(t) { if (!META[t]) META[t] = await fetch(`${BASE}/${t}/manifest.json`).then(r => r.json()); return META[t]; }
async function loadChapter(t, id) { CH[t] = CH[t] || {}; if (!CH[t][id]) CH[t][id] = await fetch(`${BASE}/${t}/${id}.json`).then(r => r.json()); return CH[t][id]; }
async function loadTopicChapters(t) { const m = await loadMeta(t); await Promise.all(m.chapters.map(c => loadChapter(t, c.id))); return m.chapters.map(c => CH[t][c.id]); }

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function fmt(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[r[i], r[j]] = [r[j], r[i]]; } return r; }
// ── Diagrams ────────────────────────────────────────────────────────────
let _mermaidReady = false, _mmdCounter = 0;
function initMermaid() {
  if (_mermaidReady) return true;
  if (!window.mermaid) return false;   // CDN not loaded (offline / blocked) → caller falls back
  try {
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: 'loose', theme: 'base',
      themeVariables: {
        background: '#0e0f12', primaryColor: '#262930', primaryTextColor: '#eef0f2',
        primaryBorderColor: '#f5b62b', lineColor: '#9aa0aa', secondaryColor: '#0f2233',
        tertiaryColor: '#0e0f12', clusterBkg: '#0f2233',
        fontFamily: '-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif', fontSize: '14px'
      }
    });
    _mermaidReady = true;
  } catch (e) { /* leave false */ }
  return _mermaidReady;
}
// Render a { kind:'mermaid'|'svg', code, caption } diagram into `el`. Degrades to
// showing the source if mermaid isn't available so the page never depends on the CDN.
async function renderDiagramInto(el, diagram) {
  if (!el || !diagram || !diagram.code) return;
  const cap = diagram.caption ? `<div class="diagram-cap">${esc(diagram.caption)}</div>` : '';
  if (diagram.kind === 'svg') { el.innerHTML = cap + `<div class="diagram-box">${diagram.code}</div>`; return; }
  if (initMermaid()) {
    try {
      const { svg } = await window.mermaid.render('mmd' + (_mmdCounter++), diagram.code);
      el.innerHTML = cap + `<div class="diagram-box">${svg}</div>`;
      return;
    } catch (e) { /* fall through to source */ }
  }
  el.innerHTML = cap + `<pre class="diagram-src">${esc(diagram.code)}</pre>`;
}

// New content uses `diagrams[]`; legacy content can keep its singular `diagram`.
// A unit/question may therefore opt into the visual deck without a migration.
function diagramsOf(owner) {
  if (!owner) return [];
  if (Array.isArray(owner.diagrams)) return owner.diagrams.filter(d => d && d.code);
  return owner.diagram && owner.diagram.code ? [owner.diagram] : [];
}

function diagramsForItem(it) {
  const questionDiagrams = diagramsOf(it.q);
  const unit = CH[it.topic] && CH[it.topic][it.chId];
  const unitDiagrams = diagramsOf(unit).filter(d => d.afterQuestion === it.qIndex);
  return questionDiagrams.concat(unitDiagrams);
}

// One-at-a-time is intentional: four small diagrams remain phone-readable instead
// of becoming a long wall of SVGs. Hiding SVG text turns the same visual into a
// label-recall prompt without maintaining a second copy of the diagram.
function renderDiagramDeck(el, diagrams, label = 'Visual models') {
  if (!el || !diagrams.length) return;
  let index = 0, recall = false, paintToken = 0;
  el.className = 'diagram-deck';
  el.innerHTML = `
    <div class="diagram-deck__head">
      <div><span class="diagram-deck__eyebrow"></span><strong class="diagram-deck__title"></strong></div>
      <span class="diagram-deck__count" aria-live="polite"></span>
    </div>
    <div class="diagram-slot"></div>
    <p class="diagram-deck__takeaway"></p>
    <div class="diagram-deck__controls">
      <button class="ds-btn ds-btn--ghost diagram-prev" type="button" aria-label="Previous diagram">‹</button>
      <button class="ds-btn ds-btn--ghost diagram-recall" type="button" aria-pressed="false">Hide labels</button>
      <button class="ds-btn ds-btn--ghost diagram-next" type="button" aria-label="Next diagram">›</button>
    </div>`;
  const eyebrow = el.querySelector('.diagram-deck__eyebrow');
  const title = el.querySelector('.diagram-deck__title');
  const count = el.querySelector('.diagram-deck__count');
  const slot = el.querySelector('.diagram-slot');
  const takeaway = el.querySelector('.diagram-deck__takeaway');
  const prev = el.querySelector('.diagram-prev');
  const next = el.querySelector('.diagram-next');
  const recallBtn = el.querySelector('.diagram-recall');

  async function paint() {
    const token = ++paintToken;
    const diagram = diagrams[index];
    recall = false;
    el.classList.remove('is-recall');
    recallBtn.textContent = 'Hide labels';
    recallBtn.setAttribute('aria-pressed', 'false');
    eyebrow.textContent = diagram.role ? `${label} · ${diagram.role}` : label;
    title.textContent = diagram.title || diagram.caption || `Diagram ${index + 1}`;
    count.textContent = `${index + 1} / ${diagrams.length}`;
    takeaway.textContent = diagram.takeaway || '';
    takeaway.hidden = !diagram.takeaway;
    prev.disabled = diagrams.length < 2;
    next.disabled = diagrams.length < 2;
    slot.innerHTML = '<div class="loading">Rendering diagram…</div>';
    await renderDiagramInto(slot, { ...diagram, caption: '' });
    if (token !== paintToken) return;
  }
  prev.addEventListener('click', () => { index = (index - 1 + diagrams.length) % diagrams.length; paint(); });
  next.addEventListener('click', () => { index = (index + 1) % diagrams.length; paint(); });
  recallBtn.addEventListener('click', () => {
    recall = !recall;
    el.classList.toggle('is-recall', recall);
    recallBtn.textContent = recall ? 'Reveal labels' : 'Hide labels';
    recallBtn.setAttribute('aria-pressed', String(recall));
  });
  paint();
}

function unitAbbrev(t) { return (META[t] && META[t].unitAbbrev) || 'Ch'; }
function chNum(c) { return c.num != null ? c.num : c.chapter; }
// One chapter's drillable items (MC + open), each with a stable SR key.
function chapterItems(t, ch) {
  return (ch.questions || []).map((q, i) => ({ topic: t, chId: ch.id, qIndex: i, key: `${t}/${ch.id}/${i}`, type: q.type || 'mc', q }));
}
function chapterStats(t, ch) {
  const items = chapterItems(t, ch);
  let mastered = 0, due = 0;
  items.forEach(it => { if (isMastered(it.key)) mastered++; if (isDue(it.key)) due++; });
  return { total: items.length, mastered, due };
}
function topicStats(t) {
  let total = 0, mastered = 0, due = 0;
  (META[t] ? META[t].chapters : []).forEach(c => { const s = chapterStats(t, CH[t][c.id]); total += s.total; mastered += s.mastered; due += s.due; });
  return { total, mastered, due, pct: total ? Math.round(mastered / total * 100) : 0 };
}

// ============================================================================
// SESSION SETUP
// ============================================================================
async function startChapter(t, chId) {
  const ch = await loadChapter(t, chId);
  progress.lastTopic = t; progress.lastChapter = chId; persist();
  const items = chapterItems(t, ch);
  let ordered;
  if (META[t] && META[t].ordered) {
    // Walkthrough topics (e.g. design problems) play the full arc in authored
    // order — requirements → estimation → deep dives read as one coherent pass.
    ordered = items;
  } else {
    const due = shuffle(items.filter(it => isDue(it.key)));
    const rest = shuffle(items.filter(it => !isDue(it.key)));
    ordered = due.concat(rest);
  }
  session = { topic: t, chId, mode: 'all', title: ch.title, items: ordered, pos: 0, right: 0, gained: 0, streak: 0, answered: false };
  renderQuestion();
}

// Crux drill — only the curated signature questions, in authored order.
async function startCrux(t, chId) {
  const ch = await loadChapter(t, chId);
  progress.lastTopic = t; progress.lastChapter = chId; persist();
  const items = chapterItems(t, ch).filter(it => it.q.crux);
  session = { topic: t, chId, mode: 'crux', title: `${ch.title} · Crux`, items, pos: 0, right: 0, gained: 0, streak: 0, answered: false };
  renderQuestion();
}

async function startMixed(t) {
  await loadTopicChapters(t);
  let pool = [];
  META[t].chapters.forEach(c => chapterItems(t, CH[t][c.id]).forEach(it => { if (isDue(it.key)) pool.push(it); }));
  if (pool.length < 12) {
    const extra = [];
    META[t].chapters.forEach(c => chapterItems(t, CH[t][c.id]).forEach(it => { if (!isDue(it.key)) extra.push({ it, box: boxOf(it.key).box }); }));
    extra.sort((a, b) => a.box - b.box);
    pool = pool.concat(extra.slice(0, 12 - pool.length).map(x => x.it));
  }
  session = { topic: t, title: 'Mixed Review', items: shuffle(pool).slice(0, 20), pos: 0, right: 0, gained: 0, streak: 0, answered: false, mixed: true };
  renderQuestion();
}

// ============================================================================
// QUESTION RENDER
// ============================================================================
function renderQuestion() {
  const app = document.getElementById('app');
  if (session.pos >= session.items.length) return renderSummary();
  const it = session.items[session.pos];
  const ch = CH[it.topic][it.chId];
  const q = it.q;
  const total = session.items.length;
  const pct = Math.round(session.pos / total * 100);
  session._wasMastered = isMastered(it.key);

  const tag = session.mixed
    ? `${unitAbbrev(it.topic)} ${chNum(ch)} · ${esc(ch.title)}`
    : `Question ${session.pos + 1} of ${total}`;

  let bodyHtml, hint;
  if (it.type === 'open') {
    bodyHtml = `
      <span class="q-tag open">Explain &amp; apply</span>
      <p class="q-stem">${fmt(q.prompt)}</p>
      <p class="open-hint">🗣️ <b>Say your answer out loud</b> as if in the interview — then reveal the model answer and grade yourself honestly.</p>
      <textarea class="open-scratch" placeholder="(optional) jot key points…"></textarea>
      <div id="explain-slot"></div>
      <div class="action-bar" id="action-bar"><button class="cta ds-btn ds-btn--primary" id="reveal-btn">Reveal model answer</button></div>`;
    hint = 'Press <code>Enter</code> or <code>Space</code> to reveal · then <code>1</code> Missed · <code>2</code> Partial · <code>3</code> Got it';
  } else {
    bodyHtml = `
      <span class="q-tag">${tag}</span>
      <p class="q-stem">${fmt(q.q)}</p>
      <div class="ds-options" id="opts">
        ${q.options.map((o, i) => `<button class="ds-opt" data-i="${i}"><span class="ds-opt__key">${'ABCD'[i]}</span><span class="ds-opt__body">${fmt(o)}</span></button>`).join('')}
      </div>
      <div id="explain-slot"></div>
      <div class="action-bar" id="action-bar"></div>`;
    hint = 'Tap an answer · keys <code>A–D</code> / <code>1–4</code> to answer, <code>Enter</code> for next';
  }

  app.innerHTML = `
    <div id="progress-wrap"><div id="progress-bar" style="width:${pct}%"></div></div>
    <div class="sess-meta">
      <span>${esc(session.title)} — ${session.pos + 1}/${total}${session.mixed ? '' : ` · <span class="q-tag" style="margin:0;padding:1px 6px">${tag}</span>`}</span>
      <span>${session.streak >= 3 ? `<span class="streak">🔥 ${session.streak} streak</span>` : `${session.right} correct`}</span>
    </div>
    ${bodyHtml}
    <p class="kbd-hint">${hint}</p>`;

  session.answered = false;
  if (it.type === 'open') {
    document.getElementById('reveal-btn').addEventListener('click', revealOpen);
  } else {
    app.querySelectorAll('.ds-opt').forEach(el => el.addEventListener('click', () => selectAnswer(parseInt(el.dataset.i, 10))));
  }
  window.scrollTo(0, 0);
}

// ── MC answer ─────────────────────────────────────────────────────────────
function selectAnswer(choice) {
  if (session.answered) return;
  session.answered = true;
  const it = session.items[session.pos];
  const q = it.q;
  const diagrams = diagramsForItem(it);
  const correct = choice === q.answer;
  grade(it.key, correct ? 'good' : 'again');
  applyOutcome(correct);

  document.querySelectorAll('.ds-opt').forEach((el, i) => {
    el.disabled = true;
    if (i === q.answer) el.classList.add('is-correct');
    else if (i === choice) el.classList.add('is-wrong');
    else el.classList.add('is-muted');
  });
  document.getElementById('explain-slot').innerHTML =
    `<div class="explain ${correct ? 'correct' : 'wrong'}"><span class="verdict ${correct ? 'correct' : 'wrong'}">${correct ? '✓ Correct.' : '✗ Not quite.'}</span>${fmt(q.explain)}</div>`
    + (diagrams.length ? `<div id="mc-diag"></div>` : '');
  if (diagrams.length) renderDiagramDeck(document.getElementById('mc-diag'), diagrams, 'Answer visual');
  showNext();
}

// ── Open reveal + self-grade ───────────────────────────────────────────────
function revealOpen() {
  if (session.answered) return;
  session.answered = true;
  const it = session.items[session.pos];
  const q = it.q;
  const diagrams = diagramsForItem(it);
  document.getElementById('explain-slot').innerHTML = `
    <div class="model">
      <h4>Key points to hit</h4>
      <ul>${(q.points || []).map(p => `<li>${fmt(p)}</li>`).join('')}</ul>
      <div class="ans">${fmt(q.answer || '')}</div>
      ${diagrams.length ? `<div id="reveal-diag"></div>` : ''}
    </div>`;
  if (diagrams.length) renderDiagramDeck(document.getElementById('reveal-diag'), diagrams, 'Answer visual');
  document.getElementById('action-bar').innerHTML = `
    <button class="cta ds-btn again" data-g="again">Missed</button>
    <button class="cta ds-btn partial" data-g="partial">Partial</button>
    <button class="cta ds-btn good" data-g="good">Got it</button>`;
  document.querySelectorAll('#action-bar .cta').forEach(el => el.addEventListener('click', () => gradeOpen(el.dataset.g)));
}
function gradeOpen(outcome) {
  const it = session.items[session.pos];
  grade(it.key, outcome);
  applyOutcome(outcome === 'good');
  nextQuestion();
}

function applyOutcome(good) {
  const it = session.items[session.pos];
  if (good) { session.right++; session.streak++; if (!session._wasMastered && isMastered(it.key)) session.gained++; }
  else { session.streak = 0; }
}
function showNext() {
  const last = session.pos === session.items.length - 1;
  document.getElementById('action-bar').innerHTML = `<button class="cta ds-btn ds-btn--primary" id="next-btn">${last ? 'Finish →' : 'Next →'}</button>`;
  document.getElementById('next-btn').addEventListener('click', nextQuestion);
}
function nextQuestion() { session.pos++; renderQuestion(); }

// ============================================================================
// SUMMARY
// ============================================================================
function renderSummary() {
  const app = document.getElementById('app');
  const total = session.items.length;
  const pct = total ? Math.round(session.right / total * 100) : 0;
  const t = session.topic;
  app.innerHTML = `
    <div class="summary">
      <h2>Session complete</h2>
      <div class="score">${session.right}/${total}</div>
      <p class="sub">${pct}% on this ${session.mixed ? 'mixed review' : 'set'}.</p>
      ${session.gained ? `<div class="gained">🎯 ${session.gained} new item${session.gained === 1 ? '' : 's'} mastered</div>` : ''}
      <div class="cta-row" style="justify-content:center;margin-top:22px">
        <button class="cta ds-btn ds-btn--primary" id="again-btn">${session.mixed ? '⚡ Another mixed set' : (session.mode === 'crux' ? '⚡ Crux again' : '↻ Drill again')}</button>
        <button class="cta ds-btn ds-btn--ghost" id="back-btn">${session.mixed ? '← All chapters' : '← Back'}</button>
      </div>
    </div>`;
  const chId = session.chId;
  const mode = session.mode;
  document.getElementById('back-btn').addEventListener('click', () => session.mixed ? renderTopicHome(t) : renderChapterDetail(t, chId));
  document.getElementById('again-btn').addEventListener('click', () =>
    session.mixed ? startMixed(t) : (mode === 'crux' ? startCrux(t, chId) : startChapter(t, chId)));
  window.scrollTo(0, 0);
}

// ============================================================================
// STATS MODAL (current topic)
// ============================================================================
async function openStats() {
  if (!curTopic) return;
  const t = curTopic;
  const m = await loadMeta(t);
  await loadTopicChapters(t);
  const byId = Object.fromEntries(m.chapters.map(c => [c.id, CH[t][c.id]]));
  let totalQ = 0, totalM = 0, totalDue = 0, seenQ = 0;
  m.chapters.forEach(c => chapterItems(t, byId[c.id]).forEach(it => {
    totalQ++; const b = boxOf(it.key); if (b.seen > 0) seenQ++; if (b.box >= MASTER_BOX) totalM++; if (isDue(it.key)) totalDue++;
  }));

  let parts = '';
  for (const part of m.parts) {
    let pm = 0, pt = 0;
    const rows = part.chapters.map(cid => {
      const ch = byId[cid]; if (!ch) return '';
      const s = chapterStats(t, ch); pm += s.mastered; pt += s.total;
      const p = s.total ? Math.round(s.mastered / s.total * 100) : 0;
      return `<div class="row"><span class="nm">${unitAbbrev(t)} ${chNum(ch)}. ${esc(ch.title)}</span>
        <span class="bar" style="max-width:90px"><i style="width:${p}%"></i></span>
        <span class="ch-frac">${s.mastered}/${s.total}</span></div>`;
    }).join('');
    parts += `<div class="part-stat"><div class="ph">${esc(part.name)} — ${pm}/${pt}</div>${rows}</div>`;
  }

  document.getElementById('stats-body').innerHTML = `
    <button class="close" id="stats-close">×</button>
    <h2>Your progress</h2>
    <p style="color:var(--muted);font-size:13px;margin:2px 0 0">${esc(m.title)}</p>
    <div class="stat-grid">
      <div class="stat-tile"><div class="n">${totalM}</div><div class="l">Mastered</div></div>
      <div class="stat-tile"><div class="n">${seenQ}</div><div class="l">Seen</div></div>
      <div class="stat-tile"><div class="n">${totalDue}</div><div class="l">Due</div></div>
    </div>
    ${parts}
    <button class="danger-link" id="reset-btn">Reset all system-design progress</button>`;
  document.getElementById('stats-modal').classList.add('is-open');
  document.getElementById('stats-close').addEventListener('click', closeStats);
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (confirm('Reset ALL system-design progress (every topic)? This cannot be undone.')) {
      progress = { __v: 1, boxes: {}, lastTopic: t, lastChapter: null };
      persist(); closeStats(); renderTopicHome(t);
    }
  });
}
function closeStats() { document.getElementById('stats-modal').classList.remove('is-open'); }

// ============================================================================
// KEYBOARD + BOOT
// ============================================================================
document.addEventListener('keydown', e => {
  if (document.getElementById('stats-modal').classList.contains('is-open')) { if (e.key === 'Escape') closeStats(); return; }
  if (!session) return;
  const it = session.items[session.pos]; if (!it) return;
  const tag = e.target.tagName;
  if (it.type === 'open') {
    if (!session.answered) {
      if ((e.key === 'Enter' || e.key === ' ') && tag !== 'TEXTAREA') { e.preventDefault(); revealOpen(); }
    } else if (/^[1-3]$/.test(e.key)) { e.preventDefault(); gradeOpen({ '1': 'again', '2': 'partial', '3': 'good' }[e.key]); }
    return;
  }
  if (!session.answered) {
    let pick = -1;
    if (/^[a-dA-D]$/.test(e.key)) pick = 'abcd'.indexOf(e.key.toLowerCase());
    else if (/^[1-4]$/.test(e.key)) pick = parseInt(e.key, 10) - 1;
    if (pick >= 0) { e.preventDefault(); selectAnswer(pick); }
  } else if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); nextQuestion(); }
});

document.getElementById('home-btn').addEventListener('click', renderTopics);
document.getElementById('stats-btn').addEventListener('click', openStats);
document.getElementById('stats-modal').addEventListener('click', e => { if (e.target.id === 'stats-modal') closeStats(); });

// Sync re-hydrate: js/sync.js pulls can rewrite jsdrill.systemdesign.v1 in the
// background (merge or replace). Without this, the page's boot-time in-memory
// `progress` clobbers the pulled data on its next persist(). Reload the blob
// and, when the user is between drills, repaint the current screen so due
// counts/mastery reflect the pull; an active drill session keeps running
// (grade() re-reads progress.boxes per grade, so nothing is lost).
window.addEventListener('drill:sync-pulled', () => {
  progress = load();
  if (!session) {
    (curTopic ? renderTopicHome(curTopic) : renderTopics()).catch(() => {});
  }
});

renderTopics().catch(err => {
  document.getElementById('app').innerHTML =
    `<div class="empty">Couldn't load content.<br><small>${esc(err.message)}</small><br><br>
     Serve this over http (e.g. <code>python3 -m http.server</code>) — <code>file://</code> can't fetch the JSON.</div>`;
  console.error(err);
});
</script>
</body>
</html>
